<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Voxel sand and water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --scene: #10131a;
    --ink: #e8e6e1;
    --ink-dim: #9a9fa9;
    --panel: rgba(18,22,30,.82);
    --line: rgba(232,230,225,.14);
    --line-strong: rgba(232,230,225,.3);
    --sand-ui: #d9a441;
    --water-ui: #4aa3d8;
    --hit: rgba(232,230,225,.09);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --scene: #d9dae0;
      --ink: #14171d;
      --ink-dim: #565d69;
      --panel: rgba(250,250,251,.88);
      --line: rgba(20,23,29,.16);
      --line-strong: rgba(20,23,29,.34);
      --hit: rgba(20,23,29,.07);
    }
  }
  :root[data-theme="light"]{
    --scene: #d9dae0;
    --ink: #14171d;
    --ink-dim: #565d69;
    --panel: rgba(250,250,251,.88);
    --line: rgba(20,23,29,.16);
    --line-strong: rgba(20,23,29,.34);
    --hit: rgba(20,23,29,.07);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--scene);
    color:var(--ink);
    font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:14px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;touch-action:none;position:fixed;inset:0}

  .readout{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 12px);
    left:12px;
    z-index:5;
    pointer-events:none;
    display:grid;
    grid-template-columns:auto auto;
    gap:1px 12px;
    font-variant-numeric:tabular-nums;
    font-size:12.5px;
    color:var(--ink-dim);
  }
  .readout b{font-weight:500;color:var(--ink);text-align:right}

  .dock{
    position:fixed;
    left:8px;right:8px;
    bottom:calc(env(safe-area-inset-bottom) + 8px);
    z-index:6;
    background:var(--panel);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:560px;
    margin:0 auto;
  }
  .dock[data-open="false"] .dock-body{display:none}

  .row{display:flex;gap:6px;align-items:center}
  .row.wrap{flex-wrap:wrap}

  button{
    font:inherit;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--line);
    border-radius:9px;
    padding:9px 12px;
    min-height:40px;
    cursor:pointer;
    flex:1 1 auto;
    white-space:nowrap;
  }
  button:active{background:var(--hit)}
  button:focus-visible{outline:2px solid var(--line-strong);outline-offset:2px}
  button[aria-pressed="true"]{border-color:currentColor;background:var(--hit)}
  button.sand[aria-pressed="true"]{color:var(--sand-ui)}
  button.water[aria-pressed="true"]{color:var(--water-ui)}
  button.icon{flex:0 0 auto;min-width:40px;padding:9px 10px}

  .slider{display:flex;align-items:center;gap:10px;flex:1 1 180px}
  .slider span{color:var(--ink-dim);font-size:12.5px;white-space:nowrap}
  .slider b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;font-size:12.5px}
  input[type=range]{
    flex:1;
    -webkit-appearance:none;appearance:none;
    background:transparent;height:24px;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-strong)}
  input[type=range]::-moz-range-track{height:2px;background:var(--line-strong)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:18px;height:18px;border-radius:50%;
    background:var(--ink);margin-top:-8px;
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border:0;border-radius:50%;background:var(--ink);
  }
  input[type=range]:focus-visible{outline:2px solid var(--line-strong);outline-offset:2px}

  .hint{
    color:var(--ink-dim);
    font-size:12px;
    text-align:center;
  }
</style>
</head>
<body>

<div class="readout">
  <span>particles</span><b id="r-count">0</b>
  <span>awake</span><b id="r-active">0</b>
  <span>ticks</span><b id="r-tick">0</b>
  <span>steps/s</span><b id="r-tps">0</b>
  <span>fps</span><b id="r-fps">0</b>
</div>

<div class="dock" id="dock" data-open="true">
  <div class="row">
    <button id="btn-play">Pause</button>
    <button id="btn-step" class="icon" title="Advance one step">Step</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-clear">Empty</button>
    <button id="btn-fold" class="icon" aria-label="Hide controls">▾</button>
  </div>

  <div class="dock-body">
    <div class="row">
      <button id="btn-sand" class="sand" aria-pressed="false">Pour sand</button>
      <button id="btn-water" class="water" aria-pressed="false">Rain water</button>
    </div>

    <div class="row wrap">
      <label class="slider">
        <span>Speed</span>
        <input id="s-speed" type="range" min="1" max="12" step="1" value="2">
        <b id="v-speed">2</b>
      </label>
      <label class="slider">
        <span>Cut top</span>
        <input id="s-slice" type="range" min="1" max="16" step="1" value="16">
        <b id="v-slice">16</b>
      </label>
    </div>

    <p class="hint">Drag to orbit · pinch or scroll to zoom · two fingers to pan</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- world ---------- */
const W = 64, D = 64, H = 16;
const LAYER = W * D;
const N = LAYER * H;
const EMPTY = 0, SAND = 1, WATER = 2;

const grid      = new Uint8Array(N);
const procStamp = new Uint32Array(N);
const queued    = new Uint8Array(N);

let curB = [], nextB = [];
for (let z = 0; z < H; z++){ curB.push([]); nextB.push([]); }

let tick = 1;
let liveCount = 0;
let dirty = true;

const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

function enqueue(i){
  if (queued[i]) return;
  queued[i] = 1;
  nextB[(i / LAYER) | 0].push(i);
}

function wake(i){
  enqueue(i);
  const z = (i / LAYER) | 0;
  const r = i - z * LAYER;
  const y = (r / W) | 0;
  const x = r - y * W;
  if (z < H - 1){
    const up = i + LAYER;
    enqueue(up);
    if (x > 0)     enqueue(up - 1);
    if (x < W - 1) enqueue(up + 1);
    if (y > 0)     enqueue(up - W);
    if (y < D - 1) enqueue(up + W);
  }
  if (x > 0)     enqueue(i - 1);
  if (x < W - 1) enqueue(i + 1);
  if (y > 0)     enqueue(i - W);
  if (y < D - 1) enqueue(i + W);
}

function place(i, v){
  if (grid[i] !== EMPTY) return false;
  grid[i] = v;
  liveCount++;
  wake(i);
  dirty = true;
  return true;
}

function moveTo(from, to, v){
  grid[to] = v;
  grid[from] = EMPTY;
  procStamp[to] = tick;
  wake(from);
  wake(to);
  dirty = true;
}

function swapWith(from, to, v, other){
  grid[to] = v;
  grid[from] = other;
  procStamp[to] = tick;
  procStamp[from] = tick;
  wake(from);
  wake(to);
  dirty = true;
}

function resolve(i, v, z){
  const r = i - z * LAYER;
  const y = (r / W) | 0;
  const x = r - y * W;

  if (v === SAND){
    if (z === 0) return;
    const below = i - LAYER, bv = grid[below];
    if (bv === EMPTY) moveTo(i, below, SAND);
    else if (bv === WATER) swapWith(i, below, SAND, WATER);
    return;
  }

  if (z > 0){
    const below = i - LAYER;
    if (grid[below] === EMPTY){ moveTo(i, below, WATER); return; }
    const o = (Math.random() * 4) | 0;
    for (let k = 0; k < 4; k++){
      const d = DIRS[(o + k) & 3];
      const nx = x + d[0], ny = y + d[1];
      if (nx < 0 || nx >= W || ny < 0 || ny >= D) continue;
      const t = below + d[0] + d[1] * W;
      if (grid[t] === EMPTY){ moveTo(i, t, WATER); return; }
    }
  }

  const o2 = (Math.random() * 4) | 0;
  for (let k = 0; k < 4; k++){
    const d = DIRS[(o2 + k) & 3];
    const nx = x + d[0], ny = y + d[1];
    if (nx < 0 || nx >= W || ny < 0 || ny >= D) continue;
    const t = i + d[0] + d[1] * W;
    if (grid[t] === EMPTY){ moveTo(i, t, WATER); return; }
  }
}

let awakeCount = 0;

function stepSim(){
  tick++;
  const tmp = curB; curB = nextB; nextB = tmp;
  const forward = (tick & 1) === 0;
  let seen = 0;

  for (let z = 0; z < H; z++){
    const b = curB[z];
    const len = b.length;
    seen += len;
    for (let k = 0; k < len; k++){
      const i = forward ? b[k] : b[len - 1 - k];
      queued[i] = 0;
      if (procStamp[i] === tick) continue;
      procStamp[i] = tick;
      const v = grid[i];
      if (v === EMPTY) continue;
      resolve(i, v, z);
    }
    b.length = 0;
  }
  awakeCount = seen;
}

/* ---------- emitters ---------- */
let pourSand = false, rainWater = false;
const TOP = (H - 1) * LAYER;

function runEmitters(){
  if (pourSand){
    for (let k = 0; k < 3; k++){
      const x = 30 + ((Math.random() * 4) | 0);
      const y = 30 + ((Math.random() * 4) | 0);
      place(TOP + x + y * W, SAND);
    }
  }
  if (rainWater){
    for (let k = 0; k < 5; k++){
      const x = (Math.random() * W) | 0;
      const y = (Math.random() * D) | 0;
      place(TOP + x + y * W, WATER);
    }
  }
}

/* ---------- presets ---------- */
function clearWorld(){
  grid.fill(0);
  queued.fill(0);
  procStamp.fill(0);
  for (let z = 0; z < H; z++){ curB[z].length = 0; nextB[z].length = 0; }
  liveCount = 0;
  tick = 1;
  dirty = true;
}

function loadPreset(){
  clearWorld();
  for (let z = 0; z < 2; z++)
    for (let i = 0; i < LAYER; i++) place(z * LAYER + i, SAND);

  for (let z = 2; z < 8; z++)
    for (let y = 2; y < 26; y++)
      for (let x = 2; x < 26; x++)
        place(z * LAYER + x + y * W, WATER);

  for (let z = 2; z < 11; z++){
    const rad = 10 - z;
    for (let y = -rad; y <= rad; y++)
      for (let x = -rad; x <= rad; x++)
        if (x * x + y * y <= rad * rad)
          place(z * LAYER + (44 + x) + (44 + y) * W, SAND);
  }
}

/* ---------- rendering ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

function sceneColor(){
  const c = getComputedStyle(document.documentElement).getPropertyValue("--scene").trim();
  return new THREE.Color(c || "#10131a");
}
function applySceneColor(){
  const c = sceneColor();
  scene.background = c;
  scene.fog = new THREE.Fog(c, 120, 340);
}
applySceneColor();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", applySceneColor);
}

scene.add(new THREE.AmbientLight(0xffffff, 0.42));
const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x2a2622, 0.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 0.85);
sun.position.set(40, 90, 30);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8fb6ff, 0.28);
fill.position.set(-50, 30, -40);
scene.add(fill);

const geo = new THREE.BoxGeometry(0.98, 0.98, 0.98);
const mat = new THREE.MeshLambertMaterial();
const mesh = new THREE.InstancedMesh(geo, mat, N);
mesh.frustumCulled = false;
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
scene.add(mesh);

const mArr = mesh.instanceMatrix.array;
for (let i = 0; i < N; i++){
  const o = i * 16;
  mArr[o] = 1; mArr[o + 5] = 1; mArr[o + 10] = 1; mArr[o + 15] = 1;
}
const cArr = mesh.instanceColor.array;

const box = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(W, H, D)),
  new THREE.LineBasicMaterial({ color: 0x8fa0b8, transparent: true, opacity: 0.32 })
);
box.position.set(0, H / 2, 0);
scene.add(box);

const floorGrid = new THREE.GridHelper(W, 8, 0x8fa0b8, 0x8fa0b8);
floorGrid.material.transparent = true;
floorGrid.material.opacity = 0.14;
floorGrid.position.y = 0.01;
scene.add(floorGrid);

const OX = -W / 2 + 0.5, OZ = -D / 2 + 0.5;
let sliceTop = H;

function rebuild(){
  let n = 0;
  const top = sliceTop - 1;
  for (let z = 0; z < sliceTop; z++){
    const zb = z * LAYER;
    for (let y = 0; y < D; y++){
      const yb = zb + y * W;
      for (let x = 0; x < W; x++){
        const i = yb + x;
        const v = grid[i];
        if (v === EMPTY) continue;

        let shown;
        if (z === top || z === 0 || x === 0 || x === W - 1 || y === 0 || y === D - 1){
          shown = true;
        } else {
          shown = grid[i - 1] === EMPTY || grid[i + 1] === EMPTY ||
                  grid[i - W] === EMPTY || grid[i + W] === EMPTY ||
                  grid[i - LAYER] === EMPTY || grid[i + LAYER] === EMPTY;
        }
        if (!shown) continue;

        const o = n * 16;
        mArr[o + 12] = x + OX;
        mArr[o + 13] = z + 0.5;
        mArr[o + 14] = y + OZ;

        const h = (((i * 2654435761) >>> 0) % 256) / 256;
        const c = n * 3;
        if (v === SAND){
          const t = 0.86 + h * 0.26;
          cArr[c]     = Math.min(1, 0.85 * t);
          cArr[c + 1] = Math.min(1, 0.66 * t);
          cArr[c + 2] = Math.min(1, 0.36 * t);
        } else {
          const t = 0.84 + h * 0.3;
          cArr[c]     = Math.min(1, 0.19 * t);
          cArr[c + 1] = Math.min(1, 0.51 * t);
          cArr[c + 2] = Math.min(1, 0.78 * t);
        }
        n++;
      }
    }
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
}

/* ---------- camera control ---------- */
const view = { theta: Math.PI * 0.72, phi: Math.PI * 0.34, radius: 98 };
const target = new THREE.Vector3(0, H * 0.4, 0);

function updateCamera(){
  const sp = Math.sin(view.phi), cp = Math.cos(view.phi);
  camera.position.set(
    target.x + view.radius * sp * Math.sin(view.theta),
    target.y + view.radius * cp,
    target.z + view.radius * sp * Math.cos(view.theta)
  );
  camera.lookAt(target);
  camera.updateMatrixWorld();
}

function clampView(){
  view.phi = Math.max(0.06, Math.min(1.55, view.phi));
  view.radius = Math.max(16, Math.min(320, view.radius));
}

const el = renderer.domElement;
const ptrs = new Map();
let lastDist = 0, lastMidX = 0, lastMidY = 0;

const right = new THREE.Vector3(), upv = new THREE.Vector3();
function pan(dx, dy){
  right.setFromMatrixColumn(camera.matrix, 0);
  upv.setFromMatrixColumn(camera.matrix, 1);
  const k = view.radius * 0.0016;
  target.addScaledVector(right, -dx * k).addScaledVector(upv, dy * k);
}

el.addEventListener("pointerdown", e => {
  el.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lastDist = 0;
});

el.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const px = p.x, py = p.y;
  p.x = e.clientX; p.y = e.clientY;

  if (ptrs.size === 1){
    const dx = e.clientX - px, dy = e.clientY - py;
    if (e.shiftKey || e.buttons === 2 || e.buttons === 4){
      pan(dx, dy);
    } else {
      view.theta -= dx * 0.0062;
      view.phi   -= dy * 0.0062;
    }
    clampView();
  } else if (ptrs.size === 2){
    const it = ptrs.values();
    const a = it.next().value, b = it.next().value;
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (lastDist > 0 && dist > 0){
      view.radius *= lastDist / dist;
      pan(mx - lastMidX, my - lastMidY);
      clampView();
    }
    lastDist = dist; lastMidX = mx; lastMidY = my;
  }
});

function endPtr(e){
  ptrs.delete(e.pointerId);
  lastDist = 0;
}
el.addEventListener("pointerup", endPtr);
el.addEventListener("pointercancel", endPtr);
el.addEventListener("contextmenu", e => e.preventDefault());
el.addEventListener("wheel", e => {
  e.preventDefault();
  view.radius *= Math.exp(e.deltaY * 0.0012);
  clampView();
}, { passive: false });

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener("resize", resize);
resize();

/* ---------- controls ---------- */
const $ = id => document.getElementById(id);
let running = true;
let speed = 2;

$("btn-play").addEventListener("click", e => {
  running = !running;
  e.currentTarget.textContent = running ? "Pause" : "Play";
});
$("btn-step").addEventListener("click", () => { runEmitters(); stepSim(); });
$("btn-reset").addEventListener("click", () => { loadPreset(); });
$("btn-clear").addEventListener("click", () => { clearWorld(); });

$("btn-sand").addEventListener("click", e => {
  pourSand = !pourSand;
  e.currentTarget.setAttribute("aria-pressed", String(pourSand));
});
$("btn-water").addEventListener("click", e => {
  rainWater = !rainWater;
  e.currentTarget.setAttribute("aria-pressed", String(rainWater));
});

$("s-speed").addEventListener("input", e => {
  speed = +e.target.value;
  $("v-speed").textContent = speed;
});
$("s-slice").addEventListener("input", e => {
  sliceTop = +e.target.value;
  $("v-slice").textContent = sliceTop;
  dirty = true;
});

const dock = $("dock");
$("btn-fold").addEventListener("click", e => {
  const open = dock.getAttribute("data-open") === "true";
  dock.setAttribute("data-open", String(!open));
  e.currentTarget.textContent = open ? "▴" : "▾";
  e.currentTarget.setAttribute("aria-label", open ? "Show controls" : "Hide controls");
});

/* ---------- loop ---------- */
let frames = 0, ticksDone = 0, lastReport = performance.now();

function loop(){
  requestAnimationFrame(loop);

  if (running){
    for (let s = 0; s < speed; s++){
      runEmitters();
      stepSim();
      ticksDone++;
    }
  }

  if (dirty){ rebuild(); dirty = false; }

  updateCamera();
  renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if (now - lastReport > 500){
    const dt = (now - lastReport) / 1000;
    $("r-fps").textContent = Math.round(frames / dt);
    $("r-tps").textContent = Math.round(ticksDone / dt);
    $("r-count").textContent = liveCount.toLocaleString();
    $("r-active").textContent = awakeCount.toLocaleString();
    $("r-tick").textContent = tick.toLocaleString();
    frames = 0; ticksDone = 0; lastReport = now;
  }
}

loadPreset();
updateCamera();
loop();

})();
</script>
</body>
</html>

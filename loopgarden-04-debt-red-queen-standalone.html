<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Loopgarden 04 · Debt Red Queen</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(7, 10, 13, .88);
      --line: rgba(255, 255, 255, .18);
      --text: #eef4ef;
      --muted: #a8b0aa;
      --accent: #b9f5c9;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    #world {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
      image-rendering: pixelated;
      background: #000;
      touch-action: none;
    }
    .panel {
      position: fixed;
      z-index: 4;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #controls {
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px;
      max-width: calc(100vw - 16px);
      white-space: nowrap;
    }
    button, select, input {
      min-height: 28px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 5px;
      background: rgba(255,255,255,.07);
      color: var(--text);
      font: inherit;
    }
    button { padding: 3px 8px; cursor: pointer; }
    button:active { background: rgba(255,255,255,.18); }
    select { padding: 2px 4px; }
    input { width: 78px; padding: 3px 6px; }
    #readout {
      min-width: 100px;
      color: var(--muted);
      text-align: right;
    }
    #moreButton { width: 30px; padding: 0; }
    #settings {
      top: max(49px, calc(env(safe-area-inset-top) + 49px));
      left: max(8px, env(safe-area-inset-left));
      width: min(360px, calc(100vw - 16px));
      padding: 9px;
    }
    #settings[hidden], #inspector[hidden] { display: none; }
    .grid {
      display: grid;
      grid-template-columns: auto minmax(0,1fr);
      gap: 7px 10px;
      align-items: center;
    }
    .grid label { color: var(--muted); }
    .grid select, .grid input { width: 100%; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 9px;
    }
    #inspector {
      left: max(8px, env(safe-area-inset-left));
      bottom: max(8px, env(safe-area-inset-bottom));
      width: min(420px, calc(100vw - 16px));
      max-height: 42vh;
      overflow: auto;
      padding: 9px 34px 9px 10px;
      white-space: pre-wrap;
    }
    #closeInspector {
      position: absolute;
      top: 4px;
      right: 4px;
      min-height: 24px;
      width: 26px;
      padding: 0;
    }
    #startup, #fatal {
      position: fixed;
      z-index: 10;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(420px, calc(100vw - 32px));
      padding: 14px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 9px;
      background: #090c0a;
      text-align: center;
    }
    #fatal {
      display: none;
      color: #ffd9d9;
      border-color: #d85f5f;
      background: #230b0b;
      white-space: pre-wrap;
      text-align: left;
    }
    .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 4px;
      border: 1px solid rgba(255,255,255,.45);
      vertical-align: -1px;
    }
    @media (max-width: 600px) {
      #controls { gap: 3px; }
      button { padding-left: 6px; padding-right: 6px; }
      #readout { min-width: 84px; font-size: 10px; }
      #stepButton { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="world" width="440" height="735" aria-label="Loopgarden simulation"></canvas>
  <div id="controls" class="panel">
    <button id="runButton" type="button">Pause</button>
    <button id="stepButton" type="button">Step</button>
    <select id="speedSelect" aria-label="Simulation speed">
      <option value="1">1×</option>
      <option value="4">4×</option>
      <option value="16">16×</option>
      <option value="64">64×</option>
      <option value="128" selected>128×</option>
      <option value="256">256×</option>
    </select>
    <span id="readout">t 0 · s 1</span>
    <button id="moreButton" type="button" aria-label="Settings">•••</button>
  </div>
  <div id="settings" class="panel" hidden>
    <div class="grid">
      <label for="modeSelect">Mode</label>
      <select id="modeSelect">
        <option value="full" selected>Debt Red Queen + grafts</option>
        <option value="evolution">Debt Red Queen, grafts off</option>
        <option value="chem-lock">Chemistry locked control</option>
        <option value="neutral">Traffic-maintained control</option>
        <option value="ancestor">Ancestor, mutation off</option>
        <option value="proof">Hand-built flow proof</option>
      </select>
      <label for="seedInput">Seed</label>
      <input id="seedInput" inputmode="numeric" value="1">
      <label for="overlaySelect">Overlay</label>
      <select id="overlaySelect">
        <option value="chemistry" selected>Chemistry</option>
        <option value="history">Environmental history</option>
        <option value="debt">Metabolic debt</option>
        <option value="owners">Plant owners</option>
        <option value="home">Inherited home</option>
        <option value="flow">Productive flow</option>
        <option value="dryness">Bond dryness</option>
      </select>
    </div>
    <div class="row">
      <button id="restartButton" type="button">Restart</button>
      <button id="fastForwardButton" type="button">+1m events</button>
      <button id="exportSceneButton" type="button">Scene JSON</button>
      <button id="exportCheckpointButton" type="button">Checkpoint</button>
      <button id="pngButton" type="button">PNG</button>
      <button id="assertButton" type="button">Check invariants</button>
      <button id="rareButton" type="button">History-pair assay</button>
    </div>
    <div id="leakNote" class="row" style="color:var(--muted)">A carrier can maintain one incoming bond per excursion through free space; growth and reproduction consume matter and also count.</div>
    <div id="ecologyReadout" class="row" style="color:var(--muted);white-space:pre-line;width:100%">Ecology metrics are warming up.</div>
    <div id="settingsStatus" class="row" style="color:var(--muted)">Tap the world to inspect matter.</div>
  </div>
  <div id="inspector" class="panel" hidden><button id="closeInspector" type="button">×</button><div id="inspectorText"></div></div>
  <div id="startup">Loopgarden script has not started.</div>
  <div id="fatal"></div>

<script>
"use strict";
(function () {
  window.__LOOPGARDEN_READY__ = false;
  window.__LOOPGARDEN_FATAL__ = null;
  var startup = document.getElementById("startup");
  var fatalBox = document.getElementById("fatal");
  startup.textContent = "Loopgarden is starting…";

  function showFatal(error) {
    var message = error && error.stack ? error.stack : String(error);
    window.__LOOPGARDEN_FATAL__ = message;
    fatalBox.textContent = "Loopgarden stopped with an error:\n\n" + message;
    fatalBox.style.display = "block";
    startup.style.display = "none";
  }
  window.addEventListener("error", function (event) { showFatal(event.error || event.message); });
  window.addEventListener("unhandledrejection", function (event) { showFatal(event.reason); });

  try {

  /* ================================================================
     1. CONSTANTS, SCHEMA, AND CENTRAL CONFIGURATION
     ================================================================ */

  var SCHEMA_VERSION = 2;
  var BUILD_VERSION = "loopgarden-04-debt-redqueen-2026-08-22";
  var FP = 256;
  var EMPTY_MAT = 0;
  var FREE = 0, CARRIER = 1, BOUND = 2, SEED = 3;
  var ROLE_ORDINARY = 0, ROLE_TIP = 1, ROLE_FLOWER = 2;
  var EDGE_ORDINARY = 0, EDGE_GRAFT = 1, EDGE_FLOWER = 2;
  var NONE = 255;
  var MODULE_STRIDE = 19;
  var M_STEPS = 0, M_CURVE = 1, M_BRANCH_STEP = 2;
  var M_LEFT_MODULE = 3, M_RIGHT_MODULE = 4;
  var M_LEFT_ANGLE = 5, M_RIGHT_ANGLE = 6, M_NEXT = 7;
  var M_FLOWER = 8, M_HOME = 9, M_TARGET = 10, M_GATE = 11;
  var M_TOL = 12, M_ROUTE_KEY = 13, M_ROUTE_NEAR = 14, M_ROUTE_FAR = 15;
  var M_PETAL_HOME = 16, M_SEED_HOME = 17, M_ACTIVE = 18;
  var ROUTE_STRAIGHT = 0, ROUTE_LEFT = 1, ROUTE_RIGHT = 2, ROUTE_REVERSE = 3;
  var ROUTE_ORDERS = [
    [ROUTE_STRAIGHT, ROUTE_LEFT, ROUTE_RIGHT, ROUTE_REVERSE],
    [ROUTE_STRAIGHT, ROUTE_RIGHT, ROUTE_LEFT, ROUTE_REVERSE],
    [ROUTE_LEFT, ROUTE_STRAIGHT, ROUTE_RIGHT, ROUTE_REVERSE],
    [ROUTE_RIGHT, ROUTE_STRAIGHT, ROUTE_LEFT, ROUTE_REVERSE],
    [ROUTE_LEFT, ROUTE_RIGHT, ROUTE_STRAIGHT, ROUTE_REVERSE],
    [ROUTE_RIGHT, ROUTE_LEFT, ROUTE_STRAIGHT, ROUTE_REVERSE]
  ];
  var STATE_NAMES = ["FREE", "CARRIER", "BOUND", "SEED"];
  var ROLE_NAMES = ["ordinary", "active tip", "flower core"];
  var EDGE_NAMES = ["ordinary", "graft", "flower"];
  var COMPOUND_NAMES = ["—","RRR","RRG","RRB","RGG","RGB","RBB","GGG","GGB","GBB","BBB"];

  var BASE_CONFIG = Object.freeze({
    width: 440,
    height: 735,
    parcelCount: 18000,
    founderClones: 16,
    founderClusters: 4,
    mode: "full",
    seed: 1,
    bucketPx: 4,
    nodeStepFp: 3 * FP,
    freeStepFp: 192,
    seedStepFp: 128,
    captureRadiusFp: 576,
    graftRadiusFp: 384,
    germinationClearanceFp: 2 * FP,
    maxNodeDegree: 4,
    maxModules: 12,
    maxBranchDepth: 8,
    maxNodesPerPlant: 1024,
    carrierProgress: 16384,
    edgeDryWarn: 36,
    edgeDryBreak: 72,
    tipFailedLimit: 96,
    flowerWaitLimit: 1536,
    flowerSenesceOpportunities: 8,
    seedMaturation: 8,
    seedMaxAge: 128,
    weightFree: 1,
    weightCarrier: 10,
    weightTip: 2,
    weightEdge: 1,
    weightFlower: 2,
    weightSeed: 2,
    pointMutationPerThousand: 220,
    chemistryMutationPerThousand: 500,
    structuralMutationPerThousand: 12,
    historySampleInterval: 100000,
    historyRegionPx: 32,
    routineLogSize: 1024,
    importantLogLimit: 250000,
    debugAssertions: true,
    nodeLeakDenominator: 0
  });

  var DIR_X = new Int16Array([256,237,181,98,0,-98,-181,-237,-256,-237,-181,-98,0,98,181,237]);
  var DIR_Y = new Int16Array([0,98,181,237,256,237,181,98,0,-98,-181,-237,-256,-237,-181,-98]);
  var FREE_DX = new Int16Array([192,178,136,74,0,-74,-136,-178,-192,-178,-136,-74,0,74,136,178]);
  var FREE_DY = new Int16Array([0,74,136,178,192,178,136,74,0,-74,-136,-178,-192,-178,-136,-74]);
  var SEED_DX = new Int16Array([128,119,91,49,0,-49,-91,-119,-128,-119,-91,-49,0,49,91,119]);
  var SEED_DY = new Int16Array([0,49,91,119,128,119,91,49,0,-49,-91,-119,-128,-119,-91,-49]);

  /* ================================================================
     2. DETERMINISTIC INTEGER UTILITIES AND PRNG
     ================================================================ */

  function rotl(x, k) { return ((x << k) | (x >>> (32 - k))) >>> 0; }
  function mix32(x) {
    x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
    x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
    return (x ^ (x >>> 16)) >>> 0;
  }
  function eventHash(seed, a, b, c) {
    var x = mix32(seed ^ 0x9e3779b9);
    x = mix32(x ^ (a >>> 0));
    x = mix32(x ^ Math.imul(b >>> 0, 0x85ebca6b));
    return mix32(x ^ Math.imul(c >>> 0, 0xc2b2ae35));
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function fpToPx(v) { return (v + 128) >> 8; }
  function headingFromVector(dx, dy) {
    var best = 0, bestDot = -Infinity, i, dot;
    for (i = 0; i < 16; i++) {
      dot = dx * DIR_X[i] + dy * DIR_Y[i];
      if (dot > bestDot) { bestDot = dot; best = i; }
    }
    return best;
  }
  function signedTurn(from, to) {
    var d = (to - from) & 15;
    return d >= 8 ? d - 16 : d;
  }
  function turnClass(from, to) {
    var d = signedTurn(from, to);
    var ad = d < 0 ? -d : d;
    if (ad <= 2) return ROUTE_STRAIGHT;
    if (ad >= 7) return ROUTE_REVERSE;
    return d > 0 ? ROUTE_RIGHT : ROUTE_LEFT;
  }

  function RNG(seed) {
    var x = (seed >>> 0) || 1;
    this.s0 = mix32(x);
    this.s1 = mix32(this.s0 + 0x9e3779b9);
    this.s2 = mix32(this.s1 + 0x9e3779b9);
    this.s3 = mix32(this.s2 + 0x9e3779b9);
    if ((this.s0 | this.s1 | this.s2 | this.s3) === 0) this.s3 = 1;
  }
  RNG.prototype.next = function () {
    var result = Math.imul(rotl(Math.imul(this.s1, 5) >>> 0, 7), 9) >>> 0;
    var t = (this.s1 << 9) >>> 0;
    this.s2 = (this.s2 ^ this.s0) >>> 0;
    this.s3 = (this.s3 ^ this.s1) >>> 0;
    this.s1 = (this.s1 ^ this.s2) >>> 0;
    this.s0 = (this.s0 ^ this.s3) >>> 0;
    this.s2 = (this.s2 ^ t) >>> 0;
    this.s3 = rotl(this.s3, 11);
    return result;
  };
  RNG.prototype.int = function (n) {
    if (n <= 1) return 0;
    var range = 4294967296;
    var limit = range - (range % n);
    var x;
    do { x = this.next(); } while (x >= limit);
    return x % n;
  };
  RNG.prototype.chance = function (numerator, denominator) {
    return numerator > 0 && this.int(denominator) < numerator;
  };
  RNG.prototype.exportState = function () { return [this.s0,this.s1,this.s2,this.s3]; };
  RNG.prototype.importState = function (s) {
    this.s0=s[0]>>>0; this.s1=s[1]>>>0; this.s2=s[2]>>>0; this.s3=s[3]>>>0;
  };

  /* ================================================================
     3. COMPOUND ALGEBRA AND AUDITED RECIPROCAL EXCHANGE
     ================================================================ */

  var COUNTS = [
    [0,0,0],
    [3,0,0], [2,1,0], [2,0,1], [1,2,0], [1,1,1],
    [1,0,2], [0,3,0], [0,2,1], [0,1,2], [0,0,3]
  ];
  var ENCODE = new Int8Array(64);
  var DIST = new Uint8Array(121);
  var SWAPS = new Array(11);
  var NEIGHBORS = new Array(11);
  var DISPLAY_RGB = new Array(11);

  function encodeCounts(r, g, b) { return ENCODE[r | (g << 2) | (b << 4)]; }
  function distCompound(a, b) { return DIST[a * 11 + b]; }
  function buildCompoundTables() {
    var i,j,a,b,x,y,ar,ag,ab,br,bg,bb,key,seen,list,maxc;
    for (i = 1; i <= 10; i++) {
      ENCODE[COUNTS[i][0] | (COUNTS[i][1] << 2) | (COUNTS[i][2] << 4)] = i;
      maxc = Math.max(COUNTS[i][0], COUNTS[i][1], COUNTS[i][2]);
      DISPLAY_RGB[i] = [
        Math.round(255 * COUNTS[i][0] / maxc),
        Math.round(255 * COUNTS[i][1] / maxc),
        Math.round(255 * COUNTS[i][2] / maxc)
      ];
    }
    DISPLAY_RGB[0] = [0,0,0];
    for (a = 0; a <= 10; a++) for (b = 0; b <= 10; b++) {
      DIST[a * 11 + b] = a && b ?
        ((Math.abs(COUNTS[a][0]-COUNTS[b][0]) + Math.abs(COUNTS[a][1]-COUNTS[b][1]) + Math.abs(COUNTS[a][2]-COUNTS[b][2])) >> 1) : 3;
    }
    for (a = 0; a <= 10; a++) {
      SWAPS[a] = new Array(11);
      NEIGHBORS[a] = [];
      for (b = 0; b <= 10; b++) SWAPS[a][b] = [];
    }
    for (a = 1; a <= 10; a++) {
      for (b = 1; b <= 10; b++) {
        seen = Object.create(null);
        list = SWAPS[a][b];
        for (x = 0; x < 3; x++) for (y = 0; y < 3; y++) {
          if (x === y || COUNTS[a][x] === 0 || COUNTS[b][y] === 0) continue;
          ar=COUNTS[a][0]; ag=COUNTS[a][1]; ab=COUNTS[a][2];
          br=COUNTS[b][0]; bg=COUNTS[b][1]; bb=COUNTS[b][2];
          if (x===0) ar--; else if (x===1) ag--; else ab--;
          if (y===0) ar++; else if (y===1) ag++; else ab++;
          if (y===0) br--; else if (y===1) bg--; else bb--;
          if (x===0) br++; else if (x===1) bg++; else bb++;
          i=encodeCounts(ar,ag,ab); j=encodeCounts(br,bg,bb);
          key=i+"."+j;
          if (!seen[key]) {
            seen[key]=1;
            list.push({carrierAfter:i,nodeAfter:j,give:x,receive:y});
          }
        }
      }
      for (b = 1; b <= 10; b++) if (DIST[a*11+b] === 1) NEIGHBORS[a].push(b);
    }
  }
  buildCompoundTables();

  function exchangeAtNode(carrierCode, nodeCode, home, target, tieKey) {
    var list = SWAPS[carrierCode][nodeCode];
    var restoring = nodeCode !== home;
    var oldPrimary = restoring ? distCompound(nodeCode, home) : distCompound(carrierCode, target);
    var bestA = 99, bestB = 99, ties = 0, i, c, a, b, choice;
    for (i = 0; i < list.length; i++) {
      c = list[i];
      a = restoring ? distCompound(c.nodeAfter, home) : distCompound(c.carrierAfter, target);
      if (a >= oldPrimary) continue;
      b = restoring ? distCompound(c.carrierAfter, target) : distCompound(c.nodeAfter, home);
      if (a < bestA || (a === bestA && b < bestB)) { bestA=a; bestB=b; ties=1; }
      else if (a === bestA && b === bestB) ties++;
    }
    if (!ties) return null;
    choice = tieKey % ties;
    for (i = 0; i < list.length; i++) {
      c = list[i];
      a = restoring ? distCompound(c.nodeAfter, home) : distCompound(c.carrierAfter, target);
      b = restoring ? distCompound(c.carrierAfter, target) : distCompound(c.nodeAfter, home);
      if (a === bestA && b === bestB) {
        if (choice === 0) return c;
        choice--;
      }
    }
    return null;
  }

  /* ================================================================
     4. ACTIVE SETS AND FAIR PERMUTATION SCHEDULER SUPPORT
     ================================================================ */

  function DenseSet(capacity) {
    this.capacity = capacity;
    this.ids = new Int32Array(capacity);
    this.pos = new Int32Array(capacity);
    this.pos.fill(-1);
    this.length = 0;
  }
  DenseSet.prototype.has = function (id) { return id >= 0 && id < this.capacity && this.pos[id] >= 0; };
  DenseSet.prototype.add = function (id) {
    if (this.pos[id] >= 0) return;
    this.pos[id] = this.length;
    this.ids[this.length++] = id;
  };
  DenseSet.prototype.remove = function (id) {
    var p=this.pos[id], last;
    if (p < 0) return;
    last=this.ids[--this.length];
    this.ids[p]=last; this.pos[last]=p; this.pos[id]=-1;
  };
  DenseSet.prototype.exportState = function () { return {ids:Array.from(this.ids.slice(0,this.length))}; };
  DenseSet.prototype.importState = function (s) {
    var i; this.length=0; this.pos.fill(-1);
    for (i=0;i<s.ids.length;i++) this.add(s.ids[i]);
  };

  function FairSet(capacity) {
    DenseSet.call(this, capacity);
    this.gen = new Uint32Array(capacity);
    this.epochIds = new Int32Array(capacity);
    this.epochGen = new Uint32Array(capacity);
    this.epochLength = 0;
    this.cursor = 0;
  }
  FairSet.prototype = Object.create(DenseSet.prototype);
  FairSet.prototype.constructor = FairSet;
  FairSet.prototype.add = function (id) {
    if (this.pos[id] >= 0) return;
    this.gen[id] = (this.gen[id] + 1) >>> 0;
    if (this.gen[id] === 0) this.gen[id] = 1;
    DenseSet.prototype.add.call(this,id);
  };
  FairSet.prototype.remove = function (id) { DenseSet.prototype.remove.call(this,id); };
  FairSet.prototype.buildEpoch = function (random) {
    var i,j,t,tg;
    this.epochLength=this.length; this.cursor=0;
    for (i=0;i<this.length;i++) {
      this.epochIds[i]=this.ids[i];
      this.epochGen[i]=this.gen[this.ids[i]];
    }
    for (i=this.epochLength-1;i>0;i--) {
      j=random.int(i+1);
      t=this.epochIds[i]; this.epochIds[i]=this.epochIds[j]; this.epochIds[j]=t;
      tg=this.epochGen[i]; this.epochGen[i]=this.epochGen[j]; this.epochGen[j]=tg;
    }
  };
  FairSet.prototype.choose = function (random) {
    var id,g,guard=0;
    while (guard++ < this.capacity + 2) {
      if (this.cursor >= this.epochLength) {
        if (!this.length) return -1;
        this.buildEpoch(random);
      }
      id=this.epochIds[this.cursor]; g=this.epochGen[this.cursor++];
      if (this.pos[id] >= 0 && this.gen[id] === g) return id;
    }
    this.buildEpoch(random);
    return this.length ? this.epochIds[this.cursor++] : -1;
  };
  FairSet.prototype.exportState = function () {
    return {
      ids:Array.from(this.ids.slice(0,this.length)),
      gen:Array.from(this.gen),
      epochIds:Array.from(this.epochIds.slice(0,this.epochLength)),
      epochGen:Array.from(this.epochGen.slice(0,this.epochLength)),
      epochLength:this.epochLength,
      cursor:this.cursor
    };
  };
  FairSet.prototype.importState = function (s) {
    var i; this.length=0; this.pos.fill(-1); this.gen.set(s.gen);
    for (i=0;i<s.ids.length;i++) {

  function isCapturePort(n) {

    nodeFlower[n]=-1;nodeTipHead[n]=-1;nodeFree.push(n);

  function carrierPositionOnEdge(pid) {

  function breakEdge(e) {

  /* ================================================================
     8. IMMUTABLE DEVELOPMENTAL GENOMES, HEREDITY, AND LINEAGES
     ================================================================ */

  function blankGenomeBytes() {
    var b=new Uint8Array(cfg.maxModules*MODULE_STRIDE),m;
    b.fill(NONE);
    for(m=0;m<cfg.maxModules;m++){
      b[moduleOffset(m,M_ACTIVE)]=0;
      b[moduleOffset(m,M_CURVE)]=1;
      b[moduleOffset(m,M_FLOWER)]=0;
      b[moduleOffset(m,M_TOL)]=1;
      b[moduleOffset(m,M_ROUTE_NEAR)]=0;
      b[moduleOffset(m,M_ROUTE_FAR)]=0;
    }
    return b;
  }
  function writeModule(b,m,o) {
    b[moduleOffset(m,M_ACTIVE)]=1;
    b[moduleOffset(m,M_STEPS)]=o.steps;
    b[moduleOffset(m,M_CURVE)]=(o.curve||0)+1;
    b[moduleOffset(m,M_BRANCH_STEP)]=o.branchStep===undefined?NONE:o.branchStep;
    b[moduleOffset(m,M_LEFT_MODULE)]=o.leftModule===undefined?NONE:o.leftModule;
    b[moduleOffset(m,M_RIGHT_MODULE)]=o.rightModule===undefined?NONE:o.rightModule;
    b[moduleOffset(m,M_LEFT_ANGLE)]=o.leftAngle||2;
    b[moduleOffset(m,M_RIGHT_ANGLE)]=o.rightAngle||2;
    b[moduleOffset(m,M_NEXT)]=o.nextModule===undefined?NONE:o.nextModule;
    b[moduleOffset(m,M_FLOWER)]=o.flower?1:0;
    b[moduleOffset(m,M_HOME)]=o.home||5;
    b[moduleOffset(m,M_TARGET)]=o.target||5;
    b[moduleOffset(m,M_GATE)]=o.gate||5;
    b[moduleOffset(m,M_TOL)]=o.tolerance===undefined?1:o.tolerance;
    b[moduleOffset(m,M_ROUTE_KEY)]=o.routeKey||5;
    b[moduleOffset(m,M_ROUTE_NEAR)]=o.routeNear||0;
    b[moduleOffset(m,M_ROUTE_FAR)]=o.routeFar||0;
    b[moduleOffset(m,M_PETAL_HOME)]=o.petalHome||5;
    b[moduleOffset(m,M_SEED_HOME)]=o.seedHome||5;
  }
  function makeAncestorGenome() {
    var b=blankGenomeBytes();
    writeModule(b,0,{steps:3,branchStep:2,leftModule:1,rightModule:2,leftAngle:2,rightAngle:2,flower:true,home:5,target:5,gate:5,tolerance:1,petalHome:5,seedHome:5});
    writeModule(b,1,{steps:3,flower:true,home:5,target:5,gate:5,tolerance:1,petalHome:5,seedHome:5});
    writeModule(b,2,{steps:3,flower:true,home:5,target:5,gate:5,tolerance:1,petalHome:5,seedHome:5});
    return b;
  }
  function genomeHash(bytes) {
    var h=2166136261>>>0,i;

    return ("00000000"+h.toString(16)).slice(-8);

  function equalBytes(a,b) {
    var i;if(a.length!==b.length)return false;

    return true;
  }
  function internGenome(bytes,parentGenome,originPlant,originSeed,description) {
    var hash=genomeHash(bytes),bucket=genomeIntern.get(hash),i,id,g;
    if(bucket)for(i=0;i<bucket.length;i++)if(equalBytes(genomes[bucket[i]].bytes,bytes))return bucket[i];
    id=genomes.length;
    g={
      id:id,hash:hash,bytes:new Uint8Array(bytes),parentGenome:parentGenome,
      originPlant:originPlant,originSeed:originSeed,birthTick:tick,
      mutation:description||"founder",firstTick:tick,lastTick:tick,births:0,extantPlants:0
    };
    genomes.push(g);if(!bucket){bucket=[];genomeIntern.set(hash,bucket);}bucket.push(id);
    return id;
  }
  function activeModules(bytes) {
    var a=[],m;for(m=0;m<cfg.maxModules;m++)if(bytes[moduleOffset(m,M_ACTIVE)])a.push(m);return a;
  }
  function mutateCompound(code) {
    var n=NEIGHBORS[code];return n.length?n[rng.int(n.length)]:code;
  }
  function mutatePoint(bytes,descriptions) {
    var active=activeModules(bytes),m,choice,field,off,v;
    if(!active.length)return;
    m=active[rng.int(active.length)];choice=rng.int(8);
    if(choice===0){
      off=moduleOffset(m,M_STEPS);v=bytes[off];bytes[off]=clamp(v+(rng.int(2)?1:-1),1,12);
      descriptions.push("module "+m+" steps "+v+"→"+bytes[off]);
    }else if(choice===1){
      off=moduleOffset(m,M_CURVE);v=bytes[off];bytes[off]=clamp(v+(rng.int(2)?1:-1),0,2);
      descriptions.push("module "+m+" curve");
    }else if(choice===2){
      off=moduleOffset(m,M_BRANCH_STEP);v=bytes[off];
      if(v===NONE)bytes[off]=rng.int(Math.max(1,bytes[moduleOffset(m,M_STEPS)]));
      else if(rng.int(4)===0)bytes[off]=NONE;
      else bytes[off]=clamp(v+(rng.int(2)?1:-1),0,bytes[moduleOffset(m,M_STEPS)]-1);
      descriptions.push("module "+m+" branch step");
    }else if(choice===3){
      field=rng.int(2)?M_LEFT_ANGLE:M_RIGHT_ANGLE;off=moduleOffset(m,field);v=bytes[off];
      bytes[off]=clamp(v+(rng.int(2)?1:-1),1,4);descriptions.push("module "+m+" branch angle");
    }else if(choice===4){
      field=[M_LEFT_MODULE,M_RIGHT_MODULE,M_NEXT][rng.int(3)];off=moduleOffset(m,field);v=bytes[off];
      if(v===NONE)bytes[off]=clamp(m+(rng.int(2)?1:-1),0,cfg.maxModules-1);
      else if(rng.int(5)===0)bytes[off]=NONE;
      else bytes[off]=clamp(v+(rng.int(2)?1:-1),0,cfg.maxModules-1);
      descriptions.push("module "+m+" reference");
    }else if(choice===5){
      field=rng.int(2)?M_ROUTE_NEAR:M_ROUTE_FAR;off=moduleOffset(m,field);v=bytes[off];
      bytes[off]=(v+(rng.int(2)?1:ROUTE_ORDERS.length-1))%ROUTE_ORDERS.length;
      descriptions.push("module "+m+" route order");
    }else if(choice===6){

    }else{

  }
  function mutateChemistry(bytes,descriptions) {
    var active=activeModules(bytes),m,field,off,before,after;
    if(!active.length)return;
    m=active[rng.int(active.length)];field=rng.int(2)?M_HOME:M_TARGET;off=moduleOffset(m,field);
    before=bytes[off];after=mutateCompound(before);bytes[off]=after;
    descriptions.push("module "+m+" "+(field===M_HOME?"home ":"product ")+COMPOUND_NAMES[before]+"→"+COMPOUND_NAMES[after]);
  }
  function mutateStructural(bytes,descriptions) {
    var active=activeModules(bytes),unused=[],m,source,target,refModule,refField,i,referenced=false;
    for(m=0;m<cfg.maxModules;m++)if(!bytes[moduleOffset(m,M_ACTIVE)])unused.push(m);
    if(unused.length&&active.length&&rng.int(2)===0){
      source=active[rng.int(active.length)];target=unused[rng.int(unused.length)];
      bytes.set(bytes.slice(source*MODULE_STRIDE,(source+1)*MODULE_STRIDE),target*MODULE_STRIDE);
      refModule=active[rng.int(active.length)];refField=[M_LEFT_MODULE,M_RIGHT_MODULE,M_NEXT][rng.int(3)];
      bytes[moduleOffset(refModule,refField)]=target;
      descriptions.push("duplicated module "+source+" as "+target);
      return;
    }
    if(active.length>1&&rng.int(3)===0){
      target=active[rng.int(active.length)];
      if(target!==0){
        for(m=0;m<cfg.maxModules;m++)if(bytes[moduleOffset(m,M_ACTIVE)]){
          if(bytes[moduleOffset(m,M_LEFT_MODULE)]===target||bytes[moduleOffset(m,M_RIGHT_MODULE)]===target||bytes[moduleOffset(m,M_NEXT)]===target)referenced=true;
        }
        if(!referenced){bytes[moduleOffset(target,M_ACTIVE)]=0;descriptions.push("deleted module "+target);return;}
      }
    }
    if(active.length){
      m=active[rng.int(active.length)];refField=rng.int(2)?M_LEFT_MODULE:M_RIGHT_MODULE;
      bytes[moduleOffset(m,refField)]=bytes[moduleOffset(m,refField)]===NONE?active[rng.int(active.length)]:NONE;
      descriptions.push("changed branch structure in module "+m);
    }
  }
  function offspringGenome(parentId,originPlant,seedParcel) {
    if(!cfg.mutationEnabled)return parentId;
    var bytes=new Uint8Array(genomes[parentId].bytes),desc=[],pointCount=0,id,chemistryChanged=false;
    if(rng.int(1000)<cfg.pointMutationPerThousand){
      pointCount=1;
      if(rng.int(6)===0)pointCount++;
      if(rng.int(24)===0)pointCount++;
    }
    while(pointCount-->0)mutatePoint(bytes,desc);
    if(cfg.chemistryMutationEnabled&&rng.int(1000)<cfg.chemistryMutationPerThousand){mutateChemistry(bytes,desc);chemistryChanged=true;}
    if(rng.int(1000)<cfg.structuralMutationPerThousand)mutateStructural(bytes,desc);
    if(!desc.length)return parentId;
    id=internGenome(bytes,parentId,originPlant,seedParcel,desc.join("; "));
    if(id!==parentId){stats.mutations++;if(chemistryChanged)stats.chemistryMutations++;logEvent("mutation",id,[parentId,id,seedParcel],{description:desc.join("; "),chemistryChanged:chemistryChanged},true);}
    return id;
  }
  function createPlantRecord(genomeId,parentPlant,parentGenome,seedParcel,parentFlower,originCluster,introduced) {
    var id=plants.length,p={
      id:id,genomeId:genomeId,parentPlant:parentPlant,parentGenome:parentGenome,
      seedParcel:seedParcel,parentFlower:parentFlower,birthTick:tick,deathTick:-1,
      originCluster:originCluster===undefined?(parentPlant>=0&&plants[parentPlant]?plants[parentPlant].originCluster:-1):originCluster,
      introduced:!!introduced,nodes:0,births:0,flowers:0,productiveInputs:0,restorations:0,foreignRestorations:0

  }

  /* ================================================================
     9. TIPS, RECURSIVE MERISTEM DEVELOPMENT, GROWTH, AND GRAFTING
     ================================================================ */

  function linkTipToNode(t,n) {
    tipNode[t]=n;tipNextAtNode[t]=nodeTipHead[n];nodeTipHead[n]=t;refreshNodeRole(n);
  }
  function unlinkTipFromNode(t) {
    var n=tipNode[t],cur,prev=-1;
    if(n<0||!nodeAlive[n])return;
    cur=nodeTipHead[n];
    while(cur>=0){
      if(cur===t){if(prev<0)nodeTipHead[n]=tipNextAtNode[cur];else tipNextAtNode[prev]=tipNextAtNode[cur];break;}
      prev=cur;cur=tipNextAtNode[cur];
    }
    tipNextAtNode[t]=-1;refreshNodeRole(n);
  }
  function createTip(n,plantId,genomeId,moduleId,heading,depth) {
    var t;
    if(moduleId===NONE||moduleId>=cfg.maxModules||!genomeGene(genomeId,moduleId,M_ACTIVE))return-1;
    if(depth>cfg.maxBranchDepth){stats.safetyRejects++;logEvent("safety-reject",-1,[plantId],{kind:"branch-depth"},true);return-1;}
    t=allocTipId();if(t<0)return-1;
    tipAlive[t]=1;tipPlant[t]=plantId;tipGenome[t]=genomeId;tipModule[t]=moduleId;tipStep[t]=0;
    tipHeading[t]=heading&15;tipDepth[t]=depth;tipFailed[t]=0;tipNextAtNode[t]=-1;
    tipSet.add(t);linkTipToNode(t,n);return t;
  }
  function destroyTip(t,releaseIfIsolated) {
    var n;
    if(t<0||!tipAlive[t])return;
    n=tipNode[t];unlinkTipFromNode(t);tipSet.remove(t);tipAlive[t]=0;tipNode[t]=-1;tipPlant[t]=-1;tipGenome[t]=-1;
    tipFree.push(t);
    if(releaseIfIsolated)maybeReleaseIsolatedNode(n,tipHeading[t]);
  }
  function moveTipToNode(t,n) {unlinkTipFromNode(t);linkTipToNode(t,n);}
  function compatibleTipAtNode(n,compound,pid) {
    var cur=nodeTipHead[n],matches=0,chosen=-1,index;
    while(cur>=0){
      if(tipAlive[cur]&&distCompound(genomeGene(tipGenome[cur],tipModule[cur],M_HOME),compound)<=1)matches++;
      cur=tipNextAtNode[cur];
    }
    if(!matches)return-1;
    index=eventHash(cfg.seed,tick,n,pid)%matches;cur=nodeTipHead[n];
    while(cur>=0){
      if(tipAlive[cur]&&distCompound(genomeGene(tipGenome[cur],tipModule[cur],M_HOME),compound)<=1){
        if(index===0){chosen=cur;break;}index--;
      }
      cur=tipNextAtNode[cur];
    }
    return chosen;
  }
  function bondPathClearCoords(x0fp,y0fp,x1fp,y1fp) {
    var x0=fpToPx(x0fp),y0=fpToPx(y0fp),x1=fpToPx(x1fp),y1=fpToPx(y1fp);
    return visitLinePixels(x0,y0,x1,y1,false,function(x,y){
      if(x<0||y<0||x>=cfg.width||y>=cfg.height)return false;
      return bondRaster[y*cfg.width+x]===0;
    });
  }
  function finishGrowthStep(t,newNode) {
    var g=tipGenome[t],m=tipModule[t],step,curve,branchStep,lm,rm,baseHeading,next,flower;
    tipFailed[t]=0;tipStep[t]++;step=tipStep[t];
    curve=genomeGene(g,m,M_CURVE)-1;tipHeading[t]=(tipHeading[t]+curve+16)&15;
    branchStep=genomeGene(g,m,M_BRANCH_STEP);

      lm=genomeGene(g,m,M_LEFT_MODULE);rm=genomeGene(g,m,M_RIGHT_MODULE);baseHeading=tipHeading[t];
      if(lm!==NONE)createTip(newNode,tipPlant[t],g,lm,(baseHeading-genomeGene(g,m,M_LEFT_ANGLE)+16)&15,tipDepth[t]+1);
      if(rm!==NONE)createTip(newNode,tipPlant[t],g,rm,(baseHeading+genomeGene(g,m,M_RIGHT_ANGLE))&15,tipDepth[t]+1);
    }
    if(step>=genomeGene(g,m,M_STEPS)){
      next=genomeGene(g,m,M_NEXT);flower=genomeGene(g,m,M_FLOWER);
      if(flower)createFlower(newNode,tipPlant[t],g,m);

      }else destroyTip(t,true);
    }
  }
  function attemptGrowth(t,pid) {
    var from=tipNode[t],heading=tipHeading[t],x,y,target,e,newNode,plantId=tipPlant[t],g=tipGenome[t],m=tipModule[t],kind;
    var deliveringEdge=parcelIncoming[pid];
    if(!tipAlive[t]||!nodeAlive[from])return false;
    if(plants[plantId]&&plants[plantId].nodes>=cfg.maxNodesPerPlant){
      stats.safetyRejects++;tipFailed[t]++;logEvent("safety-reject",t,[t,plantId],{kind:"plant-node-cap"},true);return false;
    }
    x=nodeX[from]+Math.trunc(DIR_X[heading]*cfg.nodeStepFp/FP);
    y=nodeY[from]+Math.trunc(DIR_Y[heading]*cfg.nodeStepFp/FP);
    if(x<0||y<0||x>(cfg.width-1)*FP||y>(cfg.height-1)*FP){tipFailed[t]++;return false;}
    target=nearestGraftNode(from,x,y);

      e=createEdge(from,target,EDGE_GRAFT);

        logEvent("graft",e,[e,from,target,pid],{graftKind:kind,ownerA:nodePlant[from],ownerB:nodePlant[target]},true);
        destroyTip(t,false);

        else releaseCarrier(pid,nodeX[from],nodeY[from],heading,"graft-gate-rejection");

      }

    if(target>=0||!locationClear(x,y,FP,from)||!bondPathClearCoords(nodeX[from],nodeY[from],x,y)){tipFailed[t]++;return false;}
    newNode=createNodeFromParcel(pid,x,y,plantId,g,m,null);
    if(newNode<0){tipFailed[t]++;return false;}
    e=createEdge(from,newNode,EDGE_ORDINARY);

      releaseNode(newNode,heading);tipFailed[t]++;return true;
    }
    moveTipToNode(t,newNode);stats.nodesGrown++;
    creditProductiveEdge(deliveringEdge,"growth",plantId);
    parcelExposed[pid]=0;

    finishGrowthStep(t,newNode);
    return true;
  }
  function processTipOpportunity(t) {

    }
  }

  /* ================================================================
     10. FLOWERS, PHYSICAL SEEDS, SENESCENCE, AND GERMINATION
     ================================================================ */

  function createFlower(core,plantId,genomeId,moduleId) {
    var f=allocFlowerId(),i;
    if(f<0||nodeFlower[core]>=0)return-1;
    flowerAlive[f]=1;flowerCore[f]=core;flowerPlant[f]=plantId;flowerGenome[f]=genomeId;
    /* Reproductive demand is coupled to the same two-trait metabolism. */
    flowerPetalHome[f]=nodeTarget[core];
    flowerSeedHome[f]=nodeHome[core];
    flowerStage[f]=0;flowerOpportunities[f]=0;
    for(i=0;i<4;i++)flowerPetals[i][f]=-1;
    flowerSet.add(f);nodeFlower[core]=f;refreshNodeRole(core);
    if(plants[plantId]){plants[plantId].flowers++;}stats.flowersStarted++;
    logEvent("flower-start",f,[f,core,plantId],{petalHome:COMPOUND_NAMES[flowerPetalHome[f]],seedHome:COMPOUND_NAMES[flowerSeedHome[f]]},true);
    return f;
  }
  function petalPosition(f,slot) {
    var core=flowerCore[f],dx=[0,FP,0,-FP][slot],dy=[-FP,0,FP,0][slot];
    return [nodeX[core]+dx,nodeY[core]+dy];
  }
  function petalSpotClear(f,slot) {
    var pos=petalPosition(f,slot),clear=true,i,p;
    forNearbyNodes(pos[0],pos[1],FP>>1,function(n){if(n!==flowerCore[f]){clear=false;return false;}});
    if(!clear)return false;
    for(i=0;i<4;i++){p=flowerPetals[i][f];if(p>=0&&parcelX[p]===pos[0]&&parcelY[p]===pos[1])return false;}
    return pos[0]>=0&&pos[1]>=0&&pos[0]<(cfg.width*FP)&&pos[1]<(cfg.height*FP);
  }
  function releasePetal(pid,slot) {
    if(pid<0||parcelState[pid]!==BOUND)return;
    setParcelState(pid,FREE,{x:parcelX[pid],y:parcelY[pid],heading:(slot*4+12)&15});
    stats.releases++;
  }
  function destroyFlower(f,releasePetals,allowCoreRelease) {
    var core,i,p;
    if(f<0||!flowerAlive[f])return;
    core=flowerCore[f];
    if(releasePetals)for(i=0;i<4;i++){p=flowerPetals[i][f];if(p>=0)releasePetal(p,i);flowerPetals[i][f]=-1;}
    flowerSet.remove(f);flowerAlive[f]=0;flowerCore[f]=-1;flowerFree.push(f);
    if(core>=0&&nodeAlive[core]&&nodeFlower[core]===f){nodeFlower[core]=-1;refreshNodeRole(core);}
    if(allowCoreRelease)maybeReleaseIsolatedNode(core,0);
  }
  function offerCarrierToFlower(f,pid) {
    var stage=flowerStage[f],pos,owner,parentGenome,newGenome,heading,incoming;
    if(!flowerAlive[f])return false;
    if(stage<4){
      if(parcelCompound[pid]!==flowerPetalHome[f]||!petalSpotClear(f,stage))return false;
      pos=petalPosition(f,stage);
      creditProductiveEdge(parcelIncoming[pid],"reproduction",flowerPlant[f]);

    putPixel(x,y,c);
    if(kind==="carrier"){
      putPixel(x-1,y-1,c);putPixel(x+1,y-1,c);putPixel(x-1,y+1,c);putPixel(x+1,y+1,c);
    }else if(kind==="seed"){
      putPixel(x-1,y-1,c);putPixel(x+1,y+1,c);putPixel(x+1,y-1,c);
    }
  }
  function drawTipMarker(n,x,y,c) {
    var t=nodeTipHead[n],h=t>=0?tipHeading[t]:0;
    var dx=DIR_X[h]>64?1:(DIR_X[h]<-64?-1:0),dy=DIR_Y[h]>64?1:(DIR_Y[h]<-64?-1:0);
    putPixel(x,y,c);putPixel(x+dx,y+dy,c);
  }
  function render() {
    if(!imageData)return;
    var i,p,n,e,f,x,y,c,a,b,mx,my,d,keep=[];
    clearImage();
    if(overlay==="history")drawHistoryRegions();
    for(i=0;i<freeSet.length;i++){
      p=freeSet.ids[i];
      putPixel(fpToPx(parcelX[p]),fpToPx(parcelY[p]),chemistryColor(parcelCompound[p],overlay==="history"?(parcelTransformCount[p]?0.62:0.035):0.18));
    }
    for(i=0;i<edgeSet.length;i++){
      e=edgeSet.ids[i];a=edgeA[e];b=edgeB[e];c=edgeRenderColor(e);
      drawLine(fpToPx(nodeX[a]),fpToPx(nodeY[a]),fpToPx(nodeX[b]),fpToPx(nodeY[b]),c);
      if(edgeKind[e]===EDGE_GRAFT){
        mx=fpToPx((nodeX[a]+nodeX[b])>>1);my=fpToPx((nodeY[a]+nodeY[b])>>1);
        putPixel(mx-1,my-1,[170,170,170]);putPixel(mx+1,my+1,[170,170,170]);
      }
    }
    for(i=0;i<nodeSet.length;i++){
      n=nodeSet.ids[i];x=fpToPx(nodeX[n]);y=fpToPx(nodeY[n]);c=nodeRenderColor(n,0.82);putPixel(x,y,c);
      if(nodeTipHead[n]>=0)drawTipMarker(n,x,y,nodeRenderColor(n,1));
    }
    for(i=0;i<flowerSet.length;i++){
      f=flowerSet.ids[i];
      for(d=0;d<4;d++){p=flowerPetals[d][f];if(p>=0)putPixel(fpToPx(parcelX[p]),fpToPx(parcelY[p]),chemistryColor(parcelCompound[p],0.95));}
      n=flowerCore[f];if(n>=0&&nodeAlive[n])putPixel(fpToPx(nodeX[n]),fpToPx(nodeY[n]),nodeRenderColor(n,1));
    }
    for(i=0;i<carrierSet.length;i++){p=carrierSet.ids[i];drawGlyph(fpToPx(parcelX[p]),fpToPx(parcelY[p]),chemistryColor(parcelCompound[p],1),"carrier");}
    for(i=0;i<seedSet.length;i++){p=seedSet.ids[i];drawGlyph(fpToPx(parcelX[p]),fpToPx(parcelY[p]),chemistryColor(parcelCompound[p],1),"seed");}
    if(speed<64){
      for(i=0;i<flashes.length;i++)if(flashes[i].until>=tick){
        keep.push(flashes[i]);x=fpToPx(flashes[i].x);y=fpToPx(flashes[i].y);c=[235,235,235];
        putPixel(x-2,y,c);putPixel(x+2,y,c);putPixel(x,y-2,c);putPixel(x,y+2,c);
      }
      flashes=keep;
    }else flashes.length=0;
    if(selected&&selected.type==="node"&&nodeAlive[selected.id]){
      x=fpToPx(nodeX[selected.id]);y=fpToPx(nodeY[selected.id]);c=[255,255,255];
      putPixel(x-3,y,c);putPixel(x+3,y,c);putPixel(x,y-3,c);putPixel(x,y+3,c);
    }
    ctx.putImageData(imageData,0,0);lastRenderTick=tick;
    document.getElementById("readout").textContent="t "+tick.toLocaleString()+" · s "+cfg.seed;
    updateEcologyReadout();
    if(selected)updateInspector();
  }
  function canvasPoint(event) {
    var r=canvas.getBoundingClientRect(),scale=Math.min(r.width/cfg.width,r.height/cfg.height);
    var dw=cfg.width*scale,dh=cfg.height*scale,ox=r.left+(r.width-dw)/2,oy=r.top+(r.height-dh)/2;
    return [(event.clientX-ox)/scale,(event.clientY-oy)/scale];
  }
  function selectAt(px,py) {
    var best=null,bestD=16,i,id,x,y,d,sets=[["carrier",carrierSet],["seed",seedSet],["node",nodeSet],["free",freeSet]],s;
    for(s=0;s<sets.length;s++)for(i=0;i<sets[s][1].length;i++){
      id=sets[s][1].ids[i];
      if(sets[s][0]==="node"){x=fpToPx(nodeX[id]);y=fpToPx(nodeY[id]);}
      else{x=fpToPx(parcelX[id]);y=fpToPx(parcelY[id]);}
      d=(x-px)*(x-px)+(y-py)*(y-py);
      if(d<bestD){bestD=d;best={type:sets[s][0],id:id};}
    }
    selected=best;
    document.getElementById("inspector").hidden=!best;
    if(best)updateInspector();render();
  }
  function swatchHtml(code) {
    var c=DISPLAY_RGB[code];return "<span class=\"swatch\" style=\"background:rgb("+c[0]+","+c[1]+","+c[2]+")\"></span>"+COMPOUND_NAMES[code];
  }
  function getEntity(type,id) {
    var p,n,e,f;
    if(type==="parcel"||type==="free"||type==="carrier"||type==="seed"){
      p=id;if(p<0||p>=cfg.parcelCount)return null;
      return {type:"parcel",id:p,state:STATE_NAMES[parcelState[p]],compound:COMPOUND_NAMES[parcelCompound[p]],counts:COUNTS[parcelCompound[p]].slice(),x:fpToPx(parcelX[p]),y:fpToPx(parcelY[p]),nodeId:parcelNode[p],edgeId:parcelEdge[p],incomingEdge:parcelIncoming[p],genomeId:parcelGenome[p],plantId:parcelPlant[p],age:parcelAge[p],lastTissuePlant:parcelLastPlant[p],transformCount:parcelTransformCount[p],lastTransformTick:parcelLastTransformTick[p],environmentallyExposed:!!parcelExposed[p]};
    }
    if(type==="node"){
      n=id;if(n<0||!nodeAlive[n])return null;p=nodeParcel[n];
      return {type:"node",id:n,parcelId:p,compound:COMPOUND_NAMES[parcelCompound[p]],home:COMPOUND_NAMES[nodeHome[n]],target:COMPOUND_NAMES[nodeTarget[n]],debtDistance:distCompound(parcelCompound[p],nodeHome[n]),gate:COMPOUND_NAMES[nodeGate[n]],gateTolerance:nodeGateTolerance[n],routeKey:COMPOUND_NAMES[nodeRouteKey[n]],plantId:nodePlant[n],genomeId:nodeGenome[n],moduleId:nodeModule[n],role:ROLE_NAMES[nodeRole[n]],degree:nodeDegree[n],neighbors:Array.from({length:nodeDegree[n]},function(_,i){return nodeNbr[i][n];}),flowerId:nodeFlower[n],tipIds:(function(){var a=[],t=nodeTipHead[n];while(t>=0){a.push(t);t=tipNextAtNode[t];}return a;})()};
    }
    if(type==="edge"){
      e=id;if(e<0||!edgeAlive[e])return null;
      return {type:"edge",id:e,a:edgeA[e],b:edgeB[e],kind:EDGE_NAMES[edgeKind[e]],ownerA:edgeOwnerA[e],ownerB:edgeOwnerB[e],dryMisses:edgeDryMisses[e],flowCount:edgeFlowCount[e],lastFlowTick:edgeLastFlowTick[e],productiveCount:edgeProductiveCount[e],lastProductiveTick:edgeLastProductiveTick[e],restorations:edgeRestorationCount[e],construction:edgeConstructionCount[e],reproduction:edgeReproductionCount[e]};
    }
    if(type==="flower"){
      f=id;if(f<0||!flowerAlive[f])return null;
      return {type:"flower",id:f,core:flowerCore[f],plantId:flowerPlant[f],genomeId:flowerGenome[f],stage:flowerStage[f],opportunities:flowerOpportunities[f],petalHome:COMPOUND_NAMES[flowerPetalHome[f]],seedHome:COMPOUND_NAMES[flowerSeedHome[f]],petals:[flowerPetals[0][f],flowerPetals[1][f],flowerPetals[2][f],flowerPetals[3][f]]};
    }
    if(type==="plant"){
      p=plants[id];return p?Object.assign({type:"plant",chemistrySignature:chemistrySignature(p.genomeId)},p):null;
    }
    return null;
  }
  function updateInspector() {
    var info=selected?getEntity(selected.type,selected.id):null,html="";
    if(!info){document.getElementById("inspector").hidden=true;selected=null;return;}
    if(info.type==="parcel"){
      html="<b>Parcel "+info.id+"</b> · "+info.state+"\n"+swatchHtml(parcelCompound[info.id])+" · ["+info.counts.join(", ")+"]\nposition "+info.x+", "+info.y+"\nnode "+info.nodeId+" · edge "+info.edgeId+" · incoming "+info.incomingEdge+"\ngenome "+info.genomeId+" · seed parent "+info.plantId+"\nlast chemical processor "+info.lastTissuePlant+"\ntransformations "+info.transformCount+" · last at "+info.lastTransformTick+"\nfree-space renewal "+(info.environmentallyExposed?"available":"spent");
    }else if(info.type==="node"){
      html="<b>Node "+info.id+"</b> · "+info.role+"\nactual "+swatchHtml(parcelCompound[info.parcelId])+"\nhome "+info.home+" · product "+info.target+" · debt "+info.debtDistance+"\nadmits within 1 of home · routes by product\nplant "+info.plantId+" · genome "+info.genomeId+" · module "+info.moduleId+"\ndegree "+info.degree+" · neighbors "+info.neighbors.join(", ")+"\ntips "+info.tipIds.join(", ")+" · flower "+info.flowerId;
    }else html="<b>"+info.type+" "+info.id+"</b>\n"+JSON.stringify(info,null,2);
    document.getElementById("inspectorText").innerHTML=html;
  }

  /* ================================================================
     17. RESET, PUBLIC HEADLESS API, SAVE ACTIONS, AND UI
     ================================================================ */

  function reset(options) {
    var wasPaused=paused,ancestorId,inv;
    paused=true;tick=0;selected=null;flashes=[];cfg=mergeConfig(options||{});
    rng=new RNG(cfg.seed);allocateWorld(cfg);initializeParcelInventory();
    ancestorId=internGenome(makeAncestorGenome(),-1,-1,-1,"balanced RGB common ancestor");
    if(cfg.mode==="proof")initializeProof(ancestorId);else initializeFounders(ancestorId);
    inv=assertInvariants("full");
    if(!inv.ok)throw new Error("Initialization invariant failure:\n"+inv.errors.join("\n"));
    document.getElementById("modeSelect").value=cfg.mode;document.getElementById("seedInput").value=cfg.seed;
    document.getElementById("overlaySelect").value=overlay;paused=wasPaused;updateRunButton();render();
    document.getElementById("leakNote").textContent=cfg.productiveMaintenance?"A carrier can maintain one incoming bond per excursion through free space; growth and reproduction consume matter and also count. Closed circulation dries out.":"Control: every carrier traversal maintains a bond, whether or not it performs useful work.";
    return {tick:tick,stateHash:stateHash(),invariants:inv,config:Object.assign({},cfg)};
  }
  async function runTo(targetTick,options) {
    options=options||{};targetTick=Math.max(tick,Math.floor(targetTick));
    var start=performance.now(),yieldEvery=options.yieldEvery||50000,nextYield=tick+yieldEvery,milestones=options.renderMilestones||[],mi=0,inv;
    while(mi<milestones.length&&milestones[mi]<=tick)mi++;
    while(tick<targetTick){
      stepMany(Math.min(targetTick-tick,10000));
      if(mi<milestones.length&&tick>=milestones[mi]){render();mi++;}
      if(tick>=nextYield){nextYield=tick+yieldEvery;await new Promise(function(resolve){setTimeout(resolve,0);});}
    }
    if(options.render!==false)render();
    inv=assertInvariants(options.fullAssertions?"full":"fast");
    return {tick:tick,stateHash:stateHash(),elapsedMs:performance.now()-start,invariants:inv};
  }
  function capturePNG() {
    render();return new Promise(function(resolve,reject){canvas.toBlob(function(blob){if(blob)resolve(blob);else reject(new Error("PNG capture failed"));},"image/png");});
  }
  function downloadBlob(blob,name) {
    var a=document.createElement("a"),url=URL.createObjectURL(blob);
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  function snapshot(options) {return exportScene(options);}
  function exportSceneBlob() {return new Blob([JSON.stringify(exportScene(),null,2)],{type:"application/json"});}
  function updateRunButton(){document.getElementById("runButton").textContent=paused?"Run":"Pause";}
  function setStatus(textValue){document.getElementById("settingsStatus").textContent=textValue;}

  var api={
    schemaVersion:SCHEMA_VERSION,buildVersion:BUILD_VERSION,
    get ready(){return window.__LOOPGARDEN_READY__;},
    reset:reset,
    step:function(eventCount){var n=eventCount===undefined?1:Math.max(0,eventCount|0);stepMany(n);render();return {tick:tick,stateHash:stateHash()};},
    runTo:runTo,
    pause:function(){paused=true;updateRunButton();return tick;},
    render:render,
    setOverlay:function(value){if(["chemistry","history","debt","owners","home","flow","dryness"].indexOf(value)>=0)overlay=value;document.getElementById("overlaySelect").value=overlay;render();return overlay;},
    getConfig:function(){return Object.assign({},cfg);},
    getStats:getStats,
    getEcology:getEcology,
    getEntity:getEntity,
    traceParcel:traceParcel,
    snapshot:snapshot,
    exportScene:exportScene,
    exportCheckpoint:exportCheckpoint,
    importCheckpoint:importCheckpoint,
    exportEventLog:exportEventLog,
    assertInvariants:assertInvariants,
    stateHash:stateHash,
    introduceRareVariant:introduceRareVariant,
    introduceHistoryPair:introduceHistoryPair,
    capturePNG:capturePNG,
    selfTest:runPureSelfTests
  };
  window.loopgarden=api;

  document.getElementById("runButton").addEventListener("click",function(){paused=!paused;updateRunButton();});
  document.getElementById("stepButton").addEventListener("click",function(){paused=true;updateRunButton();stepMany(1);render();});
  document.getElementById("speedSelect").addEventListener("change",function(){speed=Number(this.value)||1;});
  document.getElementById("moreButton").addEventListener("click",function(){var p=document.getElementById("settings");p.hidden=!p.hidden;});
  document.getElementById("restartButton").addEventListener("click",function(){
    try{
      reset({seed:Number(document.getElementById("seedInput").value)||1,mode:document.getElementById("modeSelect").value});
      paused=false;updateRunButton();setStatus("Restarted deterministically.");
    }catch(e){showFatal(e);}
  });
  document.getElementById("fastForwardButton").addEventListener("click",async function(){
    var button=this,target=tick+1000000;paused=true;updateRunButton();button.disabled=true;setStatus("Fast-forwarding to "+target.toLocaleString()+" events…");
    try{await runTo(target,{render:true,yieldEvery:50000});setStatus("Reached "+tick.toLocaleString()+" events. Invariants "+(assertInvariants("fast").ok?"pass":"failed")+".");}
    catch(e){showFatal(e);}finally{button.disabled=false;}
  });
  document.getElementById("overlaySelect").addEventListener("change",function(){overlay=this.value;render();});
  document.getElementById("exportSceneButton").addEventListener("click",function(){downloadBlob(exportSceneBlob(),"loopgarden-seed-"+cfg.seed+"-tick-"+tick+".scene.json");});
  document.getElementById("exportCheckpointButton").addEventListener("click",function(){downloadBlob(exportCheckpoint(),"loopgarden-seed-"+cfg.seed+"-tick-"+tick+".checkpoint.json");});
  document.getElementById("pngButton").addEventListener("click",async function(){downloadBlob(await capturePNG(),"loopgarden-seed-"+cfg.seed+"-tick-"+tick+".png");});
  document.getElementById("assertButton").addEventListener("click",function(){var inv=assertInvariants("full");setStatus(inv.ok?"All invariants pass at tick "+tick+".":inv.errors.slice(0,3).join(" · "));});
  document.getElementById("rareButton").addEventListener("click",function(){
    var result=introduceHistoryPair();lastEcologyReadoutTick=-1;render();
    setStatus(result.ok?"Inserted identical "+result.target+" product probes: plants "+result.rich.plantId+" (history-rich) and "+result.poor.plantId+" (history-poor). Compare them through getEcology().introductions.":"History-pair assay failed.");
  });
  document.getElementById("closeInspector").addEventListener("click",function(){selected=null;document.getElementById("inspector").hidden=true;render();});
  canvas.addEventListener("pointerdown",function(event){var p=canvasPoint(event);if(p[0]>=0&&p[1]>=0&&p[0]<cfg.width&&p[1]<cfg.height)selectAt(p[0],p[1]);});

  function animationLoop() {
    renderFrame++;
    if(!paused)stepMany(speed);
    if(speed<64||renderFrame%3===0||paused)render();
    requestAnimationFrame(animationLoop);
  }

  /* ================================================================
     18. STARTUP, URL PARAMETERS, AND VISIBLE FAILURE MARKERS
     ================================================================ */

  var tests=runPureSelfTests();
  if(!tests.ok)throw new Error("Startup self-tests failed:\n"+tests.errors.join("\n"));
  var params=new URLSearchParams(location.search),options={};
  if(params.has("seed"))options.seed=Number(params.get("seed"))||1;
  if(params.has("width"))options.width=Number(params.get("width"));
  if(params.has("height"))options.height=Number(params.get("height"));
  if(params.has("parcels"))options.parcelCount=Number(params.get("parcels"));
  if(params.has("mode"))options.mode=params.get("mode");
  if(params.has("founders"))options.founderClones=Number(params.get("founders"));
  if(params.has("clusters"))options.founderClusters=Number(params.get("clusters"));
  if(params.get("headless")==="1"){document.getElementById("controls").style.display="none";paused=true;}else paused=false;
  reset(options);
  window.__LOOPGARDEN_READY__=true;startup.style.display="none";
  requestAnimationFrame(animationLoop);
  if(params.has("until")){
    paused=true;updateRunButton();
    runTo(Number(params.get("until"))||0,{render:true}).then(function(result){
      document.title="Loopgarden t"+result.tick+" "+result.stateHash;
      document.documentElement.dataset.headlessDone="1";
    }).catch(showFatal);
  }

  } catch (error) {
    showFatal(error);
  }
})();
</script>

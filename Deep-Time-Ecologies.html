<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08100d">
    <meta name="description" content="A seeded artificial ecology about local adaptation, environmental memory, biological invasion, and new equilibrium.">
    <title>Deep Time Ecologies</title>
    <style>
      :root {
        --font-geist-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-geist-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
:root {
  --background: #08100d;
  --surface: #0d1713;
  --surface-2: #111d18;
  --ink: #edf1df;
  --muted: #8d9c91;
  --faint: #59665f;
  --line: rgba(220, 232, 210, 0.12);
  --line-strong: rgba(220, 232, 210, 0.22);
  --lime: #c7df8c;
  --amber: #f0b66e;
  --coral: #ee8067;
  --teal: #7fc9bd;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--background);
  color-scheme: dark;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 16% -8%, rgba(86, 121, 84, 0.16), transparent 34rem),
    radial-gradient(circle at 94% 24%, rgba(80, 116, 117, 0.09), transparent 32rem),
    var(--background);
  color: var(--ink);
  font-family: var(--font-geist-sans), Inter, ui-sans-serif, system-ui, sans-serif;
}

button,
input {
  color: inherit;
  font: inherit;
}

button {
  border: 0;
}

button:focus-visible,
canvas:focus-visible {
  outline: 2px solid var(--lime);
  outline-offset: 3px;
}

.site-shell {
  width: min(1500px, 100%);
  margin: 0 auto;
  padding: 28px clamp(18px, 3.5vw, 56px) 38px;
  overflow: hidden;
}

.hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  margin: 6px 0 24px;
}

.hero-kicker,
.eyebrow,
.module-label {
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.hero-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 0 4px rgba(199, 223, 140, 0.09), 0 0 18px rgba(199, 223, 140, 0.42);
}

.hero h1 {
  margin: 0;
  font-size: clamp(34px, 5vw, 68px);
  font-weight: 540;
  letter-spacing: -0.065em;
  line-height: 0.95;
}

.hero h1 em {
  color: var(--lime);
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
}

.hero-copy > p {
  margin: 13px 0 0;
  color: #b4beb4;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(16px, 1.6vw, 21px);
  font-style: italic;
}

.hero-clock {
  min-width: 170px;
  padding: 0 0 5px 22px;
  border-left: 1px solid var(--line-strong);
  text-align: right;
}

.hero-clock span,
.hero-clock small {
  display: block;
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 9px;
  letter-spacing: 0.13em;
}

.hero-clock strong {
  display: block;
  margin: 2px 0 3px;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 25px;
  font-weight: 580;
  letter-spacing: -0.05em;
}

.observatory {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 350px);
  gap: 14px;
  align-items: stretch;
}

.world-card,
.field-console,
.history-card,
.inspector-card,
.basin-card,
.mechanism-section,
.event-section {
  border: 1px solid var(--line);
  background: linear-gradient(145deg, rgba(17, 29, 24, 0.96), rgba(10, 18, 15, 0.97));
  box-shadow: 0 22px 70px rgba(0, 0, 0, 0.18);
}

.world-card {
  min-width: 0;
  border-radius: 18px;
  overflow: hidden;
}

.world-status,
.world-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 47px;
  padding: 8px 12px;
}

.world-status {
  border-bottom: 1px solid var(--line);
}

.phase-pill {
  flex: 0 0 auto;
  padding: 5px 8px;
  border: 1px solid;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.025);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.11em;
}

.world-live-stats {
  display: flex;
  align-items: center;
  gap: clamp(9px, 2vw, 22px);
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 9px;
  text-transform: uppercase;
}

.world-live-stats b {
  color: #dce6d7;
  font-size: 11px;
  font-weight: 600;
}

.canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  min-height: 270px;
  background: #07100d;
  overflow: hidden;
}

.world-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
  image-rendering: pixelated;
  touch-action: manipulation;
}

.paused-stamp {
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%) rotate(-2deg);
  padding: 7px 11px;
  border: 1px solid rgba(240, 182, 110, 0.72);
  color: #f3c890;
  background: rgba(6, 11, 9, 0.78);
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.28);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 10px;
  font-weight: 760;
  letter-spacing: 0.18em;
  pointer-events: none;
}

.canvas-corner-note {
  position: absolute;
  right: 9px;
  bottom: 8px;
  max-width: 80%;
  padding: 4px 7px;
  border-radius: 5px;
  background: rgba(4, 10, 8, 0.72);
  color: rgba(222, 232, 214, 0.64);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 8px;
  letter-spacing: 0.04em;
  pointer-events: none;
}

.world-toolbar {
  border-top: 1px solid var(--line);
}

.view-switch,
.speed-buttons {
  display: flex;
  gap: 4px;
}

.view-switch button,
.speed-buttons button,
.play-button,
.replay-row button {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 9px;
  font-weight: 620;
  letter-spacing: 0.05em;
  transition: 150ms ease;
}

.view-switch button:hover,
.speed-buttons button:hover,
.replay-row button:hover {
  color: var(--ink);
  background: rgba(255, 255, 255, 0.04);
}

.view-switch button.active,
.speed-buttons button.active {
  border-color: rgba(199, 223, 140, 0.25);
  background: rgba(199, 223, 140, 0.09);
  color: var(--lime);
}

.play-button {
  display: flex;
  align-items: center;
  gap: 7px;
  border-color: var(--line);
  color: #dce6d7;
}

.play-button span {
  color: var(--lime);
  font-size: 11px;
}

.field-console {
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  overflow: hidden;
}

.phase-copy {
  position: relative;
  padding: 19px 19px 17px;
  border-bottom: 1px solid var(--line);
}

.phase-copy::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 2px;
  background: var(--phase-accent);
  content: "";
}

.phase-copy .eyebrow {
  color: var(--phase-accent);
}

.phase-copy h2,
.section-heading h2,
.mechanism-intro h2,
.inspector-title h3 {
  margin: 6px 0 0;
  font-weight: 520;
  letter-spacing: -0.035em;
}

.phase-copy h2 {
  max-width: 280px;
  font-size: 23px;
  line-height: 1.07;
}

.phase-copy p {
  margin: 10px 0 0;
  color: #9fac9f;
  font-size: 12px;
  line-height: 1.55;
}

.gate-module {
  padding: 15px 17px 13px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.012);
}

.gate-module.ready {
  background: linear-gradient(130deg, rgba(240, 182, 110, 0.1), rgba(240, 182, 110, 0.025));
}

.gate-module.opened {
  display: grid;
  place-items: center;
  min-height: 92px;
  background: linear-gradient(110deg, rgba(127, 201, 189, 0.08), rgba(255, 255, 255, 0));
}

.gate-progress-copy {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.gate-progress-copy strong {
  color: #dce4d9;
  font-weight: 600;
}

.gate-progress {
  height: 2px;
  margin: 8px 0 13px;
  background: rgba(255, 255, 255, 0.08);
}

.gate-progress i {
  display: block;
  height: 100%;
  background: var(--amber);
  box-shadow: 0 0 12px rgba(240, 182, 110, 0.34);
  transition: width 220ms linear;
}

.gate-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  width: 100%;
  min-height: 51px;
  padding: 8px 12px;
  border: 1px solid rgba(240, 182, 110, 0.28);
  border-radius: 9px;
  background: rgba(240, 182, 110, 0.1);
  color: #f4d2a4;
  cursor: pointer;
  text-align: left;
  transition: 160ms ease;
}

.ready .gate-button {
  background: var(--amber);
  color: #1c150c;
  box-shadow: 0 0 34px rgba(240, 182, 110, 0.14);
}

.gate-button:hover {
  transform: translateY(-1px);
  filter: brightness(1.06);
}

.gate-button b,
.gate-button small {
  display: block;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
}

.gate-button b {
  font-size: 10px;
  letter-spacing: 0.12em;
}

.gate-button small {
  margin-top: 2px;
  font-size: 8px;
  opacity: 0.66;
}

.gate-icon {
  display: flex;
  align-items: center;
  gap: 3px;
  width: 28px;
  height: 26px;
}

.gate-icon i {
  display: block;
  width: 2px;
  height: 22px;
  background: currentColor;
  box-shadow: 7px 0 currentColor;
}

.gate-icon i:nth-child(2) {
  transform: translateY(-4px);
  opacity: 0.58;
}

.gate-icon i:nth-child(3) {
  transform: translateY(3px);
  opacity: 0.3;
}

.text-button {
  display: block;
  margin: 9px auto 0;
  padding: 3px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 8px;
  letter-spacing: 0.04em;
}

.text-button:hover {
  color: var(--ink);
}

.opened-message {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 11px;
  width: 100%;
}

.open-glyph {
  color: var(--teal);
  font-size: 29px;
}

.opened-message b,
.opened-message small {
  display: block;
}

.opened-message b {
  font-size: 13px;
}

.opened-message small {
  margin-top: 2px;
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 8px;
}

.open-live {
  color: var(--teal);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 8px;
  letter-spacing: 0.12em;
}

.speed-module {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 15px;
  border-bottom: 1px solid var(--line);
}

.speed-buttons button {
  min-width: 44px;
  min-height: 29px;
  padding: 0 8px;
}

.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
}

.metric-tile {
  min-width: 0;
  padding: 12px 13px 11px;
  background: var(--surface);
}

.metric-tile span {
  display: block;
  overflow: hidden;
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 7px;
  letter-spacing: 0.07em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.metric-tile strong {
  display: block;
  margin-top: 4px;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 18px;
  font-weight: 540;
}

.metric-tile > i {
  display: block;
  height: 2px;
  margin-top: 8px;
  background: rgba(255, 255, 255, 0.07);
}

.metric-tile > i b {
  display: block;
  max-width: 100%;
  height: 100%;
  background: var(--lime);
}

.metric-tile.amber > i b {
  background: var(--amber);
}

.metric-tile.teal > i b {
  background: var(--teal);
}

.replay-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: auto;
  padding: 8px 11px;
  border-top: 1px solid var(--line);
}

.replay-row span {
  margin-right: auto;
  color: var(--faint);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 8px;
}

.replay-row button {
  min-height: 27px;
  padding: 0 8px;
  border-color: var(--line);
  font-size: 8px;
}

.readout-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(290px, 0.75fr);
  gap: 14px;
  margin-top: 14px;
}

.history-card,
.inspector-card,
.event-section {
  border-radius: 15px;
  padding: 17px;
}

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}

.section-heading.compact {
  align-items: center;
}

.section-heading h2 {
  font-size: clamp(20px, 2.2vw, 30px);
}

.section-heading.compact h2 {
  margin-top: 4px;
  font-size: 16px;
}

.section-heading > p {
  max-width: 440px;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px 12px;
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 7px;
  text-transform: uppercase;
}

.chart-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.line-key {
  width: 13px;
  height: 2px;
}

.line-life {
  background: var(--lime);
}

.line-soil {
  background: var(--teal);
}

.line-foreign {
  background: var(--amber);
}

.history-chart {
  display: block;
  width: 100%;
  height: auto;
  margin-top: 6px;
  overflow: visible;
}

.chart-grid {
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 1;
}

.chart-axis,
.chart-time,
.contact-label {
  fill: #6e7c73;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 7px;
}

.chart-axis {
  text-anchor: end;
}

.chart-path {
  fill: none;
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.chart-life {
  stroke: var(--lime);
}

.chart-soil {
  stroke: var(--teal);
  opacity: 0.75;
}

.chart-foreign {
  stroke: var(--amber);
}

.contact-line {
  stroke: rgba(240, 182, 110, 0.48);
  stroke-width: 1;
  stroke-dasharray: 4 4;
}

.contact-label {
  fill: var(--amber);
  font-weight: 700;
  letter-spacing: 0.1em;
}

.inspector-card {
  min-height: 230px;
}

.inspector-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  min-height: 152px;
  padding: 20px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
}

.target-glyph {
  color: var(--lime);
  font-size: 28px;
}

.inspector {
  margin-top: 15px;
}

.inspector-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.inspector-title h3 {
  font-size: 15px;
}

.provenance {
  flex: 0 0 auto;
  padding: 4px 7px;
  border: 1px solid;
  border-radius: 999px;
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.provenance.native {
  border-color: rgba(142, 208, 165, 0.35);
  color: #8ed0a5;
}

.provenance.introduced {
  border-color: rgba(240, 182, 110, 0.35);
  color: var(--amber);
}

.inspector > p {
  margin: 9px 0 11px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.48;
}

.inspector-facts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin-bottom: 11px;
}

.inspector-facts span {
  padding: 5px 7px;
  border: 1px solid rgba(255, 255, 255, 0.055);
  border-radius: 5px;
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 7px;
}

.inspector-facts b {
  color: var(--ink);
  font-size: 9px;
}

.trait-row {
  display: grid;
  grid-template-columns: 74px 1fr 24px;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 7px;
  text-transform: uppercase;
}

.trait-row > i {
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
}

.trait-row > i b {
  display: block;
  height: 100%;
  background: var(--lime);
}

.trait-row strong {
  color: #aeb9af;
  font-weight: 560;
  text-align: right;
}

.basin-section {
  padding: 62px 0 28px;
}

.basin-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 24px;
}

.basin-card {
  position: relative;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  overflow: hidden;
}

.basin-card::before {
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  height: 2px;
  background: var(--basin-color);
  content: "";
}

.basin-title {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: baseline;
  gap: 8px;
}

.basin-title > span,
.basin-title > b {
  color: var(--faint);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 8px;
  font-weight: 560;
}

.basin-title h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 550;
}

.ancestry-bar {
  display: flex;
  width: 100%;
  height: 7px;
  margin: 14px 0 10px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.05);
  overflow: hidden;
}

.ancestry-bar i {
  height: 100%;
  transition: width 220ms linear;
}

.basin-facts,
.trait-pair {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 7px;
}

.basin-facts b {
  color: var(--ink);
  font-size: 9px;
}

.trait-pair {
  margin-top: 15px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

.trait-pair span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.trait-pair i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.mechanism-section {
  display: grid;
  grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
  gap: clamp(36px, 7vw, 110px);
  margin-top: 40px;
  padding: clamp(28px, 5vw, 62px);
  border-radius: 18px;
  background:
    radial-gradient(circle at 8% 20%, rgba(199, 223, 140, 0.09), transparent 34rem),
    linear-gradient(145deg, rgba(17, 29, 24, 0.98), rgba(9, 17, 14, 0.98));
}

.mechanism-intro h2 {
  margin-top: 10px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(28px, 3.6vw, 48px);
  font-weight: 400;
  line-height: 1.03;
}

.mechanism-intro > p {
  margin: 18px 0 0;
  color: #a1aea2;
  font-size: 13px;
  line-height: 1.7;
}

.rule-list {
  display: grid;
}

.rule-list > div {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 14px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.rule-list > div:first-child {
  border-top: 1px solid var(--line);
}

.rule-list span {
  color: var(--faint);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 9px;
}

.rule-list p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.rule-list b {
  display: block;
  margin-bottom: 3px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 570;
}

.event-section {
  margin-top: 14px;
  padding: 20px;
}

.event-log {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  margin: 17px 0 0;
  padding: 0;
  background: var(--line);
  list-style: none;
}

.event-log li {
  position: relative;
  min-height: 94px;
  padding: 13px;
  background: var(--surface);
}

.event-log li::before {
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  height: 1px;
  background: var(--lime);
  opacity: 0.6;
  content: "";
}

.event-log .event-contact::before,
.event-log .event-invasion::before {
  background: var(--amber);
}

.event-log .event-balance::before {
  background: var(--teal);
}

.event-log > li > span {
  color: var(--faint);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 7px;
  text-transform: uppercase;
}

.event-log b {
  display: block;
  margin-top: 7px;
  font-size: 11px;
  font-weight: 570;
}

.event-log p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.45;
}

footer {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  padding: 26px 4px 0;
  color: var(--faint);
  font-family: var(--font-geist-mono), ui-monospace, monospace;
  font-size: 8px;
  letter-spacing: 0.08em;
}

footer p {
  margin: 0;
  max-width: 560px;
  text-align: right;
}

@media (max-width: 1100px) {
  .observatory {
    grid-template-columns: minmax(0, 1fr) 300px;
  }

  .world-live-stats span:nth-child(2) {
    display: none;
  }

  .basin-grid {
    grid-template-columns: 1fr 1fr;
  }

  .event-log {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 820px) {
  .site-shell {
    padding: 17px 12px 26px;
  }

  .hero {
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .hero-clock {
    display: none;
  }

  .observatory,
  .readout-grid {
    grid-template-columns: 1fr;
  }

  .canvas-wrap {
    min-height: 0;
  }

  .field-console {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .phase-copy,
  .gate-module {
    min-height: 160px;
  }

  .speed-module,
  .metric-grid,
  .replay-row {
    grid-column: 1 / -1;
  }

  .replay-row {
    margin-top: 0;
  }

  .mechanism-section {
    grid-template-columns: 1fr;
    gap: 32px;
  }
}

@media (max-width: 560px) {
  .site-shell {
    padding-left: 8px;
    padding-right: 8px;
  }

  .hero {
    padding: 5px 5px 0;
  }

  .hero-kicker {
    font-size: 8px;
  }

  .hero h1 {
    font-size: 38px;
  }

  .hero-copy > p {
    margin-top: 8px;
    font-size: 15px;
  }

  .world-status,
  .world-toolbar {
    padding-left: 8px;
    padding-right: 8px;
  }

  .phase-pill {
    max-width: 48%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .world-live-stats {
    gap: 9px;
    font-size: 7px;
  }

  .world-live-stats b {
    font-size: 9px;
  }

  .world-live-stats span:nth-child(3) {
    display: none;
  }

  .view-switch {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }

  .view-switch button {
    min-width: 0;
    padding: 0 5px;
    font-size: 8px;
  }

  .play-button {
    padding: 0 9px;
    font-size: 0;
  }

  .play-button span {
    font-size: 12px;
  }

  .field-console {
    display: block;
  }

  .phase-copy,
  .gate-module {
    min-height: 0;
  }

  .phase-copy h2 {
    max-width: none;
  }

  .speed-module {
    padding-left: 11px;
    padding-right: 11px;
  }

  .speed-buttons {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }

  .speed-buttons button {
    min-width: 0;
  }

  .history-card,
  .inspector-card,
  .event-section {
    padding: 14px 11px;
  }

  .chart-legend {
    display: none;
  }

  .section-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .basin-section {
    padding-top: 44px;
  }

  .basin-grid {
    grid-template-columns: 1fr;
  }

  .mechanism-section {
    padding: 28px 19px;
  }

  .event-log {
    grid-template-columns: 1fr;
  }

  .event-log li {
    min-height: 0;
  }

  footer {
    flex-direction: column;
    gap: 8px;
    padding-left: 5px;
    padding-right: 5px;
  }

  footer p {
    text-align: left;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Sampler 24 — eight faces, local pollinators</title>
<style>
  :root { --ink:#c2d09b; --dim:#477345; --bloom:#d4638f; }
  html,body{ margin:0; padding:0; height:100%; background:#000; overflow:hidden;
             -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
             touch-action:manipulation; overscroll-behavior:none; }
  canvas{ display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  #hud{ position:fixed; left:9px; top:calc(9px + env(safe-area-inset-top));
        font:10px/1.65 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
        letter-spacing:.07em; color:var(--ink); opacity:.5;
        pointer-events:none; white-space:pre; text-transform:uppercase; }
  #hud.off{ display:none; }
  #bar{ position:fixed; left:0; right:0; bottom:0; display:flex; gap:1px;
        padding-bottom:env(safe-area-inset-bottom);
        background:#080a20; border-top:1px solid #1b2145; }
  #bar button{
        flex:1; min-height:50px; border:0; background:#0e1230; color:var(--dim);
        font:11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
        letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
        padding:0; -webkit-appearance:none; }
  #bar button:active{ background:#151a3c; }
  #bar button.on{ color:var(--bloom); background:#151a3c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="bar">
  <button data-a="play">pause</button>
  <button data-a="speed">1&times;</button>
  <button data-a="scale">4px</button>
  <button data-a="sow">sow</button>
  <button data-a="resow">reset</button>
  <button data-a="info">info</button>
</div>

<script>
"use strict";
/* ============================================================
   SAMPLER 24 — waterless exposed-tissue ecology
   No water, vapor, sap, soil, cast shadows, visual shading, flower-shape
   genes, or preset stem swelling. Plants grow one-cell strokes, flower,
   seed, and die. Tissue earns energy from all eight of its open faces;
   enclosed tissue still costs upkeep. Reproduction is clonal.

   Eight and not four. Counting only the four cardinal faces pays a 45-degree
   staircase almost twice what an upright or flat stroke earns for the same
   upkeep, because a diagonal touches its own body only at the corners. That
   is not a preference evolution discovers, it is an accounting error, and it
   ate this world twice. Over eight faces a diagonal and an upright cell earn
   exactly the same. Do not change this back.

   BLOOM COLOUR is one number, 0 to 255, the whole way round the wheel.
   The ancestor is red at 0 and every other colour is drift from there.
   Every flower is the same five-cell cross. A bloom far round the wheel from
   the blooms NEAR IT pays less for seed. The reach is a few blocks, not the
   whole field, so the advantage is something you can see the cause of by
   looking at one patch. That is the only pressure on colour.

   Ground is black, and so is the page behind it. A seed in the air is not
   drawn at all; it shows only once it takes a
   cell of its own. Nothing paints over a plant. A body that cannot
   bloom, and a seed with nowhere to root, both give way at once.

   A bloom is always whole and shares a full cell edge with its stem.

   Question this build answers: does colour spread out from red on its
   own, and does it settle anywhere?
   ============================================================ */

const Q = new URLSearchParams(location.search);
const CFG = {
  px:   +(Q.get("px")   || 4),
  w:    +(Q.get("w")    || 0),
  h:    +(Q.get("h")    || 0),
  seed: +(Q.get("seed") || 7),
  tps:  +(Q.get("tps")  || 30),
  n:    +(Q.get("n")    || 40),
  recolonise: (Q.get("recolonise") ?? "1") !== "0",
};

/* ---------- tuning ----------
   The six dials worth turning are overridable from the URL, so a value can be
   tried without a rebuild: ?senesce=2600&seedcost=52&germclear=2 and so on. */
const T = (k, d) => { const v = Q.get(k); return v === null ? d : +v; };
const UPKEEP        = T("upkeep", 0.004);
const SENESCE       = T("senesce", 200);
const AGE_COST      = 0.60;
const MARK_COST     = T("markcost", 0.25);
const SEED_ENERGY   = T("seedenergy", 4);
const SEED_COST     = T("seedcost", 7);
const STARVE_DEBT   = 25;     // energy below zero before a plant gives out
const PHOTO         = T("photo", 0.02); // energy per open tissue face per tick, over all eight
const BLK           = T("blk", 16);      // pollinators look 3 blocks across, so about 24 cells
const SEED_WALK     = 55;
const SEED_LIFE     = T("seedlife", 900);   // dormancy: long enough to ride out a drought
const GERM_CLEAR    = T("germclear", 3);
const MUT_P         = T("mut", 0.35);   // fast morphology search; mutations themselves stay small
const GRACE         = T("grace", 0);     // ticks a grown plant with no bloom hangs on
const PATIENCE      = T("patience", 0);  // ticks a landed seed waits for room before giving up
const HUE_MUT       = T("huemut", 0.25); // chance a child's bloom drifts round the wheel
const HUE_STEP      = T("huestep", 14);  // how far it drifts when it does, either way
const NOVELTY       = T("novelty", 0.5); // maximum proportional discount at 128 hue steps
const MUT_P2        = T("mut2", 0.25);  // conditional: 8.75% of all children get a second change
const MAX_NODES     = 20;

/* ---------- palette (16, fixed, shared by all life) ---------- */
const HEX = [0x000000,0x477345,0xc2d09b,0x2a1e15,0xf4e8cc];
const GROUND=0, STEM=1, STEM_LIT=2, SEED_C=3, BLOOM_CORE=4;

/* Bloom colour is one number, 0 to 255, the whole way round the wheel. The
   ancestor is red at 0. Saturation and brightness are fixed, so a flower
   stays in the same register as the rest of the palette however it drifts. */
const HUES = 256;
const hueGap = (a,b) => { const d=Math.abs(a-b); return Math.min(d,HUES-d); };   // 0..128
function hsv(h,s,v){
  const c=v*s, hp=(h/HUES)*6, xx=c*(1-Math.abs(hp%2-1)), m=v-c;
  let r,g,b;
  if(hp<1){r=c;g=xx;b=0;} else if(hp<2){r=xx;g=c;b=0;} else if(hp<3){r=0;g=c;b=xx;}
  else if(hp<4){r=0;g=xx;b=c;} else if(hp<5){r=xx;g=0;b=c;} else {r=c;g=0;b=xx;}
  return (255<<24)|(((b+m)*255|0)<<16)|(((g+m)*255|0)<<8)|(((r+m)*255|0));
}
const BLOOM_LIT=new Uint32Array(HUES);
for(let h=0;h<HUES;h++) BLOOM_LIT[h]=hsv(h,0.62,0.88);
const PAL = new Uint32Array(HEX.map(h =>
  (255<<24)|((h&255)<<16)|(((h>>8)&255)<<8)|((h>>16)&255)));

/* ---------- cell kinds ---------- */
const OPEN=0, LIVE=1, SEED_CELL=2;
const TISSUE=0, PETAL=1, CORE=2;

const DX=[0,1,1,1,0,-1,-1,-1], DY=[-1,-1,0,1,1,1,0,-1];

let worldSeed=(CFG.seed>>>0)||1;
let rngState=worldSeed;
function reseed(v){ worldSeed=(v>>>0)||1; rngState=worldSeed; }
function rand(){ rngState^=rngState<<13; rngState^=rngState>>>17; rngState^=rngState<<5; return (rngState>>>0)/4294967296; }
const randInt=n=>(rand()*n)|0;
const pick=a=>a[randInt(a.length)];

/* ============================================================
   THE GRAMMAR
   ============================================================ */
const S=(turn,len,...ch)=>({k:"S",turn,len,ch});
const F=turn=>({k:"F",turn,ch:[]});

function strokeCells(x,y,dir,len){
  const spine=[];
  const dx=DX[dir],dy=DY[dir];
  for(let i=0;i<len;i++){
    const cx=x+dx*i, cy=y+dy*i;
    spine.push(cx,cy);
  }
  return spine;
}
function flowerCells(x,y){
  const arm=[[0,-1],[1,0],[0,1],[-1,0]];
  const petals=[],cores=[];
  for(const[a,b]of arm) petals.push(x+a,y+b);
  cores.push(x,y);
  return {petals,cores};
}

/* ============================================================
   THE COMMON ANCESTOR — everything later is earned from this
   ============================================================ */
const ANCESTOR = S(0,3,F(0));
ANCESTOR.hue = 0;                        // everything starts one colour and earns the rest

/* ============================================================
   HEREDITY
   Clonal for now. All reproduction routes through breed(), which
   takes a list of parents — always one today, so that pollen can
   be added later as a patch rather than a rewrite.
   ============================================================ */
const clone = n => ({...n, ch:n.ch.map(clone)});
const newTurn = () => randInt(3)-1;      // left, continue, or right with equal probability

function walk(root){
  const out=[];
  (function rec(n,p){ out.push({n,p}); for(const c of n.ch) rec(c,n); })(root,null);
  return out;
}
const size = root => walk(root).length;

function mutate(root){
  const nodes=walk(root);
  const roll=rand();

  if(roll<0.20 && size(root)<MAX_NODES){          // graft: duplicate and diverge
    const host=pick(nodes.filter(e=>e.n.k==="S"&&e.n.ch.length<3));
    if(host){
      const limb=clone(pick(nodes).n);
      if(size(root)+size(limb)<=MAX_NODES){
        limb.turn=newTurn();                       // never silently inherit the host's slope
        host.n.ch.push(limb); return root;
      }
    }
  }
  if(roll<0.34){                                   // prune
    const victim=pick(nodes.filter(e=>e.p));
    if(victim){ const i=victim.p.ch.indexOf(victim.n); if(i>=0) victim.p.ch.splice(i,1); return root; }
  }

  const e=pick(nodes), n=e.n;                      // perturb one field
  if(n.k==="S"){
    const fields=["len"];
    if(e.p) fields.push("turn");
    if(e.p&&n.ch.length===0) fields.push("flower");
    const f=pick(fields);
    // A +1 diagonal is equally likely to mutate back to 0 as onward to +2;
    // the same mirror rule applies to -1.
    if(f==="turn") n.turn = Math.max(-3, Math.min(3, n.turn + (rand()<0.5?-1:1)));
    else if(f==="len") n.len = Math.max(2, Math.min(7, n.len + (rand()<0.5?-1:1)));
    else { n.k="F"; delete n.len; }
  } else {
    // Insert a new one-cell-wide shoot before the same simple flower.
    // After a diagonal, -1 bends back toward vertical exactly as often as
    // 0 repeats the diagonal and +1 bends farther away.
    n.k="S"; n.turn=newTurn(); n.len=2+randInt(4); n.ch=[F(0)];
  }
  return root;
}

function breed(parents){
  const g = clone(parents[0]);
  if(rand()<MUT_P){ mutate(g); if(rand()<MUT_P2) mutate(g); }
  if(rand()<HUE_MUT) g.hue = (g.hue + HUES + randInt(2*HUE_STEP+1) - HUE_STEP) % HUES;
  return g;
}

/** A short signature so distinct morphologies can be counted. */
function formCode(n){ return n.k==="S" ? `s${n.turn}${n.len}(${n.ch.map(formCode).join("")})` : "f"; }

/* ============================================================
   GLOBAL BLOOM COLOUR
   The population's circular mean hue is rebuilt once per tick. Ordinary
   arithmetic would put 253 and 3 near 128; vector averaging correctly puts
   them near 0. A perfectly balanced wheel has no mean and gives no bonus.
   ============================================================ */
const HUE_COS=new Float64Array(HUES), HUE_SIN=new Float64Array(HUES);
for(let h=0;h<HUES;h++){
  const a=2*Math.PI*h/HUES; HUE_COS[h]=Math.cos(a); HUE_SIN[h]=Math.sin(a);
}
let meanHue=0, meanDefined=false, bloomCount=0;
let bw,bh,blockCos,blockSin,blockN;

/* Blooms are tallied into coarse blocks once a tick. A plant then reads the
   nine blocks around its own — roughly 24 cells in each direction — so the
   colour it is competing against is the colour of its own patch, which you
   can see. Vector averaging, because plain arithmetic would put 253 and 3
   near 128 instead of near 0. */
function tallyBlooms(){
  blockCos.fill(0); blockSin.fill(0); blockN.fill(0);
  let sx=0,sy=0,n=0;
  for(const p of plants){
    if(!p.done || !p.flowers.length) continue;
    const heads=p.flowers.length, hue=p.genome.hue;
    const b=((p.baseY/BLK)|0)*bw + ((p.baseX/BLK)|0);
    blockCos[b]+=HUE_COS[hue]*heads; blockSin[b]+=HUE_SIN[hue]*heads; blockN[b]+=heads;
    sx+=HUE_COS[hue]*heads; sy+=HUE_SIN[hue]*heads; n+=heads;
  }
  bloomCount=n;                                   // readout only
  meanDefined=n>0&&Math.hypot(sx,sy)>1e-9;
  if(meanDefined) meanHue=(Math.atan2(sy,sx)*HUES/(2*Math.PI)+HUES)%HUES;
}

/** The prevailing bloom colour within a block or so of this plant, or -1 if
    it is the only thing in bloom nearby and so has nothing to stand out from. */
function localHue(p){
  const bx=(p.baseX/BLK)|0, by=(p.baseY/BLK)|0;
  let sx=0,sy=0,n=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const nx=bx+dx, ny=by+dy;
    if(nx<0||ny<0||nx>=bw||ny>=bh) continue;
    const b=ny*bw+nx; sx+=blockCos[b]; sy+=blockSin[b]; n+=blockN[b];
  }
  // take this plant's own blooms back out, or it is competing with itself
  const heads=p.flowers.length, hue=p.genome.hue;
  sx-=HUE_COS[hue]*heads; sy-=HUE_SIN[hue]*heads; n-=heads;
  if(n<=0||Math.hypot(sx,sy)<1e-9) return -1;
  return (Math.atan2(sy,sx)*HUES/(2*Math.PI)+HUES)%HUES;
}

/* ============================================================
   WORLD
   ============================================================ */
let W,H,N,kind,role,owner,buf,img,off,offCtx,hueAt;
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
const hud=document.getElementById("hud");
const bar=document.getElementById("bar");

let plants=[], seeds=[];
let freeIds=[], nextId=1, tick=0, paused=false, acc=0, lastT=0;
let generation=0, born=0, died=0, recolonised=0;
let sowMode=false, showInfo=true;
const SPEEDS=[1,4,16,64,128,256]; let speedI=0;
let lastPaint=0;
let rateTick=0,rateTime=0,actualTps=0;

const idx=(x,y)=>y*W+x;
const inB=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const openAt=(x,y)=>!inB(x,y)||kind[idx(x,y)]===OPEN;
const passable=(x,y)=>inB(x,y)&&kind[idx(x,y)]===OPEN;

function barH(){ return bar.offsetHeight || 50; }

function setupWorld(){
  const px=CFG.px;
  const availH = window.innerHeight - barH();
  W = CFG.w || Math.max(60, Math.floor(window.innerWidth/px));
  H = CFG.h || Math.max(40, Math.floor(availH/px));
  N = W*H;
  kind=new Uint8Array(N); role=new Uint8Array(N);
  owner=new Uint16Array(N); hueAt=new Uint8Array(N);
  bw=Math.ceil(W/BLK); bh=Math.ceil(H/BLK);
  blockCos=new Float64Array(bw*bh); blockSin=new Float64Array(bw*bh);
  blockN=new Int32Array(bw*bh);
  canvas.width=W*px; canvas.height=H*px;
  canvas.style.width=(W*px)+"px"; canvas.style.height=(H*px)+"px";
  off=document.createElement("canvas"); off.width=W; off.height=H;
  offCtx=off.getContext("2d",{alpha:false});
  img=offCtx.createImageData(W,H); buf=new Uint32Array(img.data.buffer);
  ctx.imageSmoothingEnabled=false;
}

function takeId(){ return freeIds.length ? freeIds.pop() : (nextId<65535 ? nextId++ : 1); }

/* ============================================================
   PLANT
   ============================================================ */
class Plant {
  constructor(genome,x,y,gen){
    this.id=takeId(); this.genome=genome; this.formCode=formCode(genome);
    this.gen=gen||0; if(this.gen>generation) generation=this.gen;
    this.queue=[{node:genome,x,y,dir:0,d:0}];
    this.cells=[]; this.energy=SEED_ENERGY; this.age=0;
    this.openFaces=0; this.flowers=[]; this.sterileAge=0;
    this.baseX=x; this.baseY=y; this.done=false; this.marks=0;
    born++;
  }

  fits(pairs,strict,dir=-1){
    let fresh=0;
    const proposed=new Set();
    for(let i=0;i<pairs.length;i+=2) if(inB(pairs[i],pairs[i+1])) proposed.add(idx(pairs[i],pairs[i+1]));
    for(let i=0;i<pairs.length;i+=2){
      const x=pairs[i],y=pairs[i+1];
      if(!inB(x,y)) return false;
      const j=idx(x,y);
      if(kind[j]===LIVE){
        if(owner[j]!==this.id) return false;
        if(strict) return false;        // a flower may not be built through itself
        continue;
      }
      if(kind[j]===SEED_CELL) return false;
      fresh++;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=x+dx,ny=y+dy; if(!inB(nx,ny))continue;
        const m=idx(nx,ny);
        if(kind[m]===LIVE&&owner[m]!==this.id) return false;
      }
    }
    // Strokes may grow beside earlier strokes, but never form a bundle more
    // than three cells across perpendicular to their own direction.
    if(dir>=0){
      const pd=(dir+2)&7, px=DX[pd],py=DY[pd];
      const mine=(x,y)=>inB(x,y)&&(proposed.has(idx(x,y))||
        (kind[idx(x,y)]===LIVE&&owner[idx(x,y)]===this.id));
      for(let i=0;i<pairs.length;i+=2){
        const x=pairs[i],y=pairs[i+1]; let wide=1;
        for(const s of [-1,1]) for(let k=1;k<=3;k++){
          if(!mine(x+px*k*s,y+py*k*s)) break;
          if(++wide>3) return false;
        }
      }
    }
    return fresh>0;
  }

  write(pairs,r,d){
    for(let i=0;i<pairs.length;i+=2){
      const x=pairs[i],y=pairs[i+1],j=idx(x,y);
      if(kind[j]===LIVE) continue;
      let freshFaces=0;
      for(let q=0;q<8;q++){
        const nx=x+DX[q],ny=y+DY[q];
        if(!inB(nx,ny)||kind[idx(nx,ny)]!==LIVE){ freshFaces++; continue; }
        const m=idx(nx,ny);
        if(owner[m]===this.id&&role[m]===TISSUE) this.openFaces--;
      }
      kind[j]=LIVE; role[j]=r; owner[j]=this.id;
      hueAt[j]=this.genome.hue;
      if(r===TISSUE) this.openFaces+=freshFaces;
      this.cells.push(j);
    }
  }

  costOf(job){
    const{node,x,y,dir}=job;
    if(node.k==="F"){ const m=flowerCells(x,y); return (m.petals.length+m.cores.length)/2*MARK_COST; }
    return strokeCells(x,y,dir,node.len).length/2*MARK_COST;
  }

  grow(){
    if(this.done) return;
    let guard=0;
    while(this.queue.length&&guard++<8){
      const job=this.queue[0], cost=this.costOf(job);
      if(this.energy<cost) return;              // wait and save
      this.queue.shift();
      if(this.place(job,cost)){ this.marks++; return; }
    }
    if(!this.queue.length) this.done=true;
  }

  place(job,cost){
    const{node,x,y,dir,d}=job;
    if(node.k==="F"){
      // Sit the head at the nearest step off the stem tip that leaves the
      // whole shape intact: no petal on the tip, and at least one petal
      // sharing an edge with it. Diagonal rings cannot do that while perfectly
      // centred on the diagonal, so only then may the head shift one cell aside.
      const sx=x-DX[dir], sy=y-DY[dir];
      let fx=0, fy=0, petals=null, cores=null;
      const pd=(dir+2)&7, candidates=[];
      for(let k=1;k<=2;k++) candidates.push([k,0]);
      for(let k=1;k<=2;k++) candidates.push([k,-1],[k,1]);
      for(const [k,q] of candidates){
        const cx=x+DX[dir]*(k-1)+DX[pd]*q;
        const cy=y+DY[dir]*(k-1)+DY[pd]*q;
        const m=flowerCells(cx,cy), all=m.petals.concat(m.cores);
        let onTip=false, touching=false;
        for(let i=0;i<all.length;i+=2){
          const ax=Math.abs(all[i]-sx), ay=Math.abs(all[i+1]-sy);
          if(ax===0&&ay===0) onTip=true;
          else if(ax+ay===1) touching=true;       // share an edge; corner contact looks detached
        }
        if(!onTip&&touching){ fx=cx; fy=cy; petals=m.petals; cores=m.cores; break; }
      }
      if(!petals) return false;
      if(!this.fits(petals.concat(cores), true)) return false;
      this.write(petals,PETAL,d); this.write(cores,CORE,d);
      const fcells=[];
      for(let i=0;i<petals.length;i+=2) fcells.push(idx(petals[i],petals[i+1]));
      for(let i=0;i<cores.length;i+=2)  fcells.push(idx(cores[i],cores[i+1]));
      this.flowers.push({x:fx,y:fy,cells:fcells});                    // every head is a seed launch site
      this.energy-=cost; return true;
    }
    const spine=strokeCells(x,y,dir,node.len);
    if(!this.fits(spine,false,dir)) return false;
    for(let i=0;i<spine.length;i+=2) this.write([spine[i],spine[i+1]],TISSUE,d+(i>>1));
    this.energy-=cost;
    const tx=spine[spine.length-2], ty=spine[spine.length-1];
    for(const child of node.ch){
      const cd=(dir+child.turn+8)&7;
      this.queue.push({node:child,x:tx+DX[cd],y:ty+DY[cd],dir:cd,d:d+node.len});
    }
    return true;
  }

  photosynthesize(){
    this.energy+=this.openFaces*PHOTO;
  }

  /** Mature plants turn income into seed. */
  /** No flower, no seed. Each head sets seed on its own, from where it stands. */
  sow(){
    if(!this.done || !this.flowers.length) return;
    // Shortest way round the wheel from the prevailing colour of this patch,
    // normalized so the opposite hue (128 steps away) earns the full bonus.
    const near=localHue(this);
    const odd=near<0?0:hueGap(this.genome.hue,near)/(HUES/2);
    const cost = SEED_COST*(1-NOVELTY*odd);

    for(const h of this.flowers){
      if(this.energy < cost) return;
      this.energy -= cost;
      const g = breed([this.genome]);
      seeds.push(new Seed(g, h.x, h.y, this.gen+1));
    }
  }

  upkeep(){
    this.age++;
    const a=this.age/SENESCE;
    this.energy -= this.cells.length*UPKEEP + a*a*AGE_COST;
    // grown, and never going to bloom: hold the ground briefly, then let go
    if(this.done && !this.flowers.length && ++this.sterileAge > GRACE) return true;
    return this.energy < -STARVE_DEBT;          // true if this plant gives out
  }

  die(){
    for(const j of this.cells){
      if(kind[j]!==LIVE||owner[j]!==this.id) continue;
      owner[j]=0; role[j]=0; kind[j]=OPEN;
    }
    freeIds.push(this.id);
    died++;
  }
}

/* ============================================================
   SEED — disperses, then tries to germinate
   ============================================================ */
class Seed {
  constructor(genome,x,y,gen){
    this.genome=genome; this.gen=gen; this.age=0;
    this.steps=20+randInt(SEED_WALK); this.i=-1;
    this.x=x; this.y=y;
  }
  occupy(){ if(passable(this.x,this.y)){ this.i=idx(this.x,this.y); kind[this.i]=SEED_CELL; } }
  settled(){ const k=kind[idx(this.x,this.y)];   // its own marker counts as landed
              return k===SEED_CELL||k===OPEN; }
  release(){ if(this.i>=0&&kind[this.i]===SEED_CELL){ kind[this.i]=OPEN; } this.i=-1; }

  step(){
    this.age++;
    if(this.age>SEED_LIFE){ this.release(); return false; }

    if(this.steps>0){                            // in flight: ignores the world
      this.steps--;
      const d=randInt(8);                        // no bias in any direction
      const nx=this.x+DX[d], ny=this.y+DY[d];
      if(inB(nx,ny)){ this.x=nx; this.y=ny; }
      if(this.steps===0 && !passable(this.x,this.y)) this.steps=4;   // keep hunting
      return true;
    }
    this.occupy();
    if(!this.settled()){ this.steps=4; return true; }   // resting on soil counts as landed

    // Germinate wherever there is room to stand.
    for(let dy=-GERM_CLEAR;dy<=GERM_CLEAR;dy++)for(let dx=-GERM_CLEAR;dx<=GERM_CLEAR;dx++){
      const nx=this.x+dx,ny=this.y+dy;
      if(!inB(nx,ny)) continue;
      const k=kind[idx(nx,ny)];
      if(k===LIVE){                              // too crowded to stand here
        if(this.age < PATIENCE) return true;     // wait, if it has been told to
        this.release(); return false;            // otherwise give up, and let go of the cell
      }
    }
    this.release();
    const pl=new Plant(this.genome,this.x,this.y,this.gen);
    pl.grow();
    if(pl.cells.length===0){                     // no room to take root
      born--; freeIds.push(pl.id); this.occupy(); return true;
    }
    plants.push(pl);
    return false;
  }
}

/* ============================================================
   SOWING
   ============================================================ */
function clearWorld(){
  kind.fill(0); role.fill(0); owner.fill(0); hueAt.fill(0);
  plants=[]; seeds=[]; freeIds=[];
  nextId=1; tick=0; acc=0; lastPaint=0;
  generation=0; born=0; died=0; recolonised=0;
  meanHue=0; meanDefined=false; bloomCount=0;
  rateTick=0; rateTime=0; actualTps=0;
}

function sowWorld(){
  clearWorld();
  colonise(CFG.n);
}

function colonise(n){
  let tries=0;
  let placed=0;
  while(placed<n&&tries<n*200){
    tries++;
    const x=5+randInt(W-10),y=8+randInt(H-16);
    if(kind[idx(x,y)]!==OPEN) continue;
    let clear=true;
    for(const p of plants)
      if(Math.abs(p.baseX-x)<12&&Math.abs(p.baseY-y)<14){ clear=false; break; }
    if(!clear) continue;
    const sd=new Seed(clone(ANCESTOR),x,y,0);
    sd.steps=0;                                  // sown where it lies
    seeds.push(sd); placed++;
  }
}

/* ============================================================
   RENDER — uniform tissue; exposure affects metabolism, never colour
   ============================================================ */
function render(){
  for(let j=0;j<N;j++){
    if(kind[j]===OPEN){ buf[j]=PAL[GROUND]; continue; }
    if(kind[j]===SEED_CELL){ buf[j]=PAL[SEED_C]; continue; }
    if(role[j]===PETAL){ buf[j]=BLOOM_LIT[hueAt[j]]; continue; }
    buf[j]=PAL[role[j]===CORE?BLOOM_CORE:STEM_LIT];
  }
  offCtx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(off,0,0,canvas.width,canvas.height);
}

/* ============================================================
   LOOP
   ============================================================ */
function step(){
  tick++;
  tallyBlooms();

  for(let i=plants.length-1;i>=0;i--){
    const p=plants[i];
    p.photosynthesize(); p.grow(); p.sow();
    if(p.cells.length===0 || p.upkeep()){ p.die(); plants.splice(i,1); continue; }
  }
  for(let i=seeds.length-1;i>=0;i--) if(!seeds[i].step()) seeds.splice(i,1);

  // a world rule, not a user gate: bare ground eventually gets colonised
  if(CFG.recolonise && plants.length===0 && seeds.length===0 && tick%400===0){
    colonise(6); recolonised++;
  }
}

function frame(t){
  const dt=Math.min(100,t-lastT); lastT=t;
  if(!paused){
    acc=Math.min(250,acc+dt);
    const iv=1000/(CFG.tps*SPEEDS[speedI]);
    const t0=performance.now();
    while(acc>=iv){
      acc-=iv; step();
      if(performance.now()-t0>14) break;          // keep backlog; never discard requested work
    }
  }
  // Simulation gets nearly the whole frame at high speed; visuals remain
  // readable rather than consuming 60 full-grid renders per second.
  const paintEvery=speedI>=4?100:speedI>=3?50:0;
  if(paused||!paintEvery||t-lastPaint>=paintEvery){
    if(!rateTime) rateTime=t;
    if(t-rateTime>=500){
      actualTps=(tick-rateTick)*1000/(t-rateTime); rateTick=tick; rateTime=t;
    }
    render(); drawHud(); lastPaint=t;
  }
  requestAnimationFrame(frame);
}

function drawHud(){
  if(!showInfo) return;
  let cells=0,energy=0;
  const forms=new Set();
  for(const p of plants){
    cells+=p.cells.length; energy+=p.energy; forms.add(p.formCode);
  }
  hud.textContent =
    `sampler 24  ${W}\u00d7${H}  ${CFG.px}px  t${tick}\n`+
    `plants ${plants.length}  seeds ${seeds.length}  cells ${cells}\n`+
    `forms ${forms.size}  gen ${generation}  born ${born}  died ${died}\n`+
    `energy ${Math.round(energy)}  blooms ${bloomCount}\n`+
    `mean ${meanDefined?Math.round(meanHue):"--"}  ${Math.round(actualTps)}t/s  seed ${worldSeed}`+
    (recolonised?`  recol ${recolonised}`:``);
}

/* ============================================================
   TOUCH UI
   ============================================================ */
function syncBar(){
  for(const b of bar.children){
    const a=b.dataset.a;
    if(a==="play"){ b.textContent=paused?"play":"pause"; b.classList.toggle("on",paused); }
    if(a==="speed"){ b.textContent=SPEEDS[speedI]+"\u00d7"; b.classList.toggle("on",speedI>0); }
    if(a==="scale"){ b.textContent=CFG.px+"px"; }
    if(a==="sow"){ b.classList.toggle("on",sowMode); }
    if(a==="info"){ b.classList.toggle("on",showInfo); }
  }
  hud.classList.toggle("off",!showInfo);
}

bar.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  switch(b.dataset.a){
    case "play":  paused=!paused; break;
    case "speed": speedI=(speedI+1)%SPEEDS.length; break;
    case "scale": CFG.px=CFG.px>1?(CFG.px===4?3:CFG.px===3?2:1):4; boot(); break;
    case "sow":   sowMode=!sowMode; break;
    case "resow": reseed((Math.random()*4294967295)>>>0); sowWorld(); break;
    case "info":  showInfo=!showInfo; break;
  }
  syncBar();
});

canvas.addEventListener("pointerdown",e=>{
  if(!sowMode) return;
  const r=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CFG.px), y=Math.floor((e.clientY-r.top)/CFG.px);
  if(!inB(x,y)||kind[idx(x,y)]!==OPEN) return;
  const sd=new Seed(clone(ANCESTOR),x,y,generation); sd.steps=0; seeds.push(sd);
});

addEventListener("keydown",e=>{
  const k=e.key;
  if(k===" "){ paused=!paused; e.preventDefault(); }
  else if(k==="r"||k==="R"){ reseed((Math.random()*4294967295)>>>0); sowWorld(); }
  else if(k==="ArrowRight"){ speedI=Math.min(SPEEDS.length-1,speedI+1); }
  else if(k==="ArrowLeft"){ speedI=Math.max(0,speedI-1); }
  else if(k==="i"||k==="I"){ showInfo=!showInfo; }
  syncBar();
});

let rt;
addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(boot,200); });

function boot(){ setupWorld(); sowWorld(); syncBar(); }
boot();
requestAnimationFrame(t=>{ lastT=t; frame(t); });
</script>
</body>
</html>
